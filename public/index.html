<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>DZ Spy Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 15px; margin: 10px; border-radius: 8px; display: inline-block; width: 250px; }
        img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🚀 رادار المنتجات المكتشفة</h1>
    <div id="out">جاري التحميل...</div>
    <script>
        fetch('/api/spy-results').then(r => r.json()).then(data => {
            document.getElementById('out').innerHTML = data.map(p => `
                <div class="card">
                    <img src="${p.image}">
                    <h3>${p.title}</h3>
                    <p>السعر: ${p.price}$</p>
                    <small>${p.store}</small>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
