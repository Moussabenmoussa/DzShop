<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body{font-family:'Tajawal',sans-serif;background:#f3f4f6;padding-bottom:90px}</style>
</head>
<body>

    <div class="bg-white p-4 shadow-sm flex items-center gap-3 sticky top-0 z-50">
        <button onclick="history.back()" class="text-slate-600"><i class="fas fa-arrow-right text-xl"></i></button>
        <h1 class="font-bold text-slate-800 text-lg flex-1 truncate" id="hTitle">...</h1>
    </div>

    <div class="max-w-xl mx-auto">
        <div class="bg-white mb-2">
            <img id="pImg" src="" class="w-full h-80 object-cover">
        </div>

        <div class="bg-white p-5 mb-2 shadow-sm">
            <div class="flex justify-between items-start mb-2">
                <h1 id="pTitle" class="text-2xl font-black text-slate-900 leading-snug">...</h1>
            </div>
            <div class="flex items-center gap-2 mb-4">
                <span id="pPrice" class="text-3xl font-bold text-blue-600">...</span>
                <span class="text-sm font-bold text-slate-500">د.ج</span>
            </div>
            <div class="flex gap-2">
                <div class="bg-green-50 text-green-700 px-3 py-1 rounded text-xs font-bold flex items-center gap-1"><i class="fas fa-truck"></i> توصيل سريع</div>
                <div class="bg-blue-50 text-blue-700 px-3 py-1 rounded text-xs font-bold flex items-center gap-1"><i class="fas fa-shield-alt"></i> ضمان الجودة</div>
            </div>
        </div>

        <div class="bg-white p-5 shadow-sm mb-4">
            <h3 class="font-bold text-lg mb-3 border-b pb-2">وصف المنتج</h3>
            <div id="pDesc" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line">...</div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] md:max-w-xl md:mx-auto">
        <button onclick="openModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl text-lg shadow-lg flex justify-center items-center gap-2">
            <span>أطلب الآن</span> <i class="fas fa-shopping-cart"></i>
        </button>
    </div>

    <div id="orderModal" class="fixed inset-0 bg-black/70 hidden justify-center items-end md:items-center z-[100] transition-opacity">
        <div class="bg-white w-full md:w-96 p-6 rounded-t-3xl md:rounded-2xl shadow-2xl animate-slide-up">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">تأكيد الطلب 📦</h3>
                <button onclick="closeModal()" class="bg-gray-100 w-8 h-8 rounded-full">✕</button>
            </div>
            
            <form onsubmit="order(event)" class="space-y-4">
                <div class="relative">
                    <i class="fas fa-user absolute top-3.5 right-4 text-gray-400"></i>
                    <input id="name" required class="w-full bg-slate-50 border p-3 pr-10 rounded-xl outline-none focus:border-blue-500" placeholder="الاسم الكامل">
                </div>
                <div class="relative">
                    <i class="fas fa-phone absolute top-3.5 right-4 text-gray-400"></i>
                    <input id="phone" type="tel" required class="w-full bg-slate-50 border p-3 pr-10 rounded-xl outline-none focus:border-blue-500 text-left ltr" placeholder="رقم الهاتف">
                </div>
                <div class="relative">
                    <i class="fas fa-map-marker-alt absolute top-3.5 right-4 text-gray-400"></i>
                    <input id="wilaya" required class="w-full bg-slate-50 border p-3 pr-10 rounded-xl outline-none focus:border-blue-500" placeholder="الولاية / العنوان">
                </div>
                <button class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg mt-2">تأكيد نهائي ✅</button>
            </form>
        </div>
    </div>

    <style>@keyframes slide-up { from {transform: translateY(100%)} to {transform: translateY(0)} }</style>

<script>
    const pid = window.location.pathname.split('/').pop();
    const ref = new URLSearchParams(window.location.search).get('ref');

    // بصمة لمنع الغش
    function getFingerprint() { return Math.abs(((navigator.userAgent+screen.width).split("").reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0))).toString(16); }

    fetch('/api/product/' + pid).then(r=>r.json()).then(p => {
        if(!p.title) return document.body.innerHTML = '<div class="text-center mt-20 font-bold">المنتج غير موجود</div>';
        document.title = p.title;
        document.getElementById('hTitle').innerText = p.title;
        document.getElementById('pTitle').innerText = p.title;
        document.getElementById('pPrice').innerText = p.price;
        document.getElementById('pImg').src = p.image || 'https://via.placeholder.com/500';
        document.getElementById('pDesc').innerText = p.desc || 'لا يوجد وصف لهذا المنتج.';
    });

    function openModal() { document.getElementById('orderModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    async function order(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';
        btn.disabled = true;

        const data = {
            productId: pid, affiliateId: ref, fingerprint: getFingerprint(),
            customer: {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                wilaya: document.getElementById('wilaya').value
            }
        };

        const res = await fetch('/api/order', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
        const r = await res.json();

        if(r.success) {
            document.body.innerHTML = `
                <div class="fixed inset-0 bg-white flex flex-col items-center justify-center p-6 text-center z-[200]">
                    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-5xl mb-6 text-green-600">✓</div>
                    <h2 class="text-2xl font-black text-slate-800 mb-2">تم تسجيل طلبك!</h2>
                    <p class="text-slate-500">شكراً لثقتك بنا. سيتصل بك فريقنا قريباً.</p>
                </div>`;
        } else {
            alert(r.msg || 'خطأ');
            btn.innerHTML = 'تأكيد نهائي ✅'; btn.disabled = false;
        }
    }
</script>
</body>
</html>
