<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب منتج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-[Tajawal]">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
        <img id="pImg" class="w-full h-72 object-cover bg-gray-200">
        <div class="p-6">
            <h1 id="pTitle" class="text-2xl font-black text-slate-800 mb-2">...</h1>
            <div class="text-3xl font-bold text-blue-600 mb-6" id="pPrice">...</div>
            <form onsubmit="order(event)" class="space-y-4">
                <input id="name" required class="w-full bg-gray-50 border p-3 rounded-lg" placeholder="الاسم واللقب">
                <input id="phone" type="tel" required class="w-full bg-gray-50 border p-3 rounded-lg text-left ltr" placeholder="رقم الهاتف">
                <input id="wilaya" required class="w-full bg-gray-50 border p-3 rounded-lg" placeholder="الولاية">
                <button class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg mt-4 text-lg">تأكيد الطلب ✅</button>
            </form>
        </div>
    </div>

<script>
    const pid = window.location.pathname.split('/').pop();
    const ref = new URLSearchParams(window.location.search).get('ref');

    function getFingerprint() {
        return Math.abs(((navigator.userAgent+screen.width).split("").reduce(function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a},0))).toString(16);
    }

    fetch('/api/product/' + pid).then(r=>r.json()).then(p => {
        document.title = p.title;
        document.getElementById('pImg').src = p.image;
        document.getElementById('pTitle').innerText = p.title;
        document.getElementById('pPrice').innerText = p.price + ' د.ج';
    });

    async function order(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.innerText = 'جاري...';

        const data = {
            productId: pid, affiliateId: ref,
            fingerprint: getFingerprint(), // إرسال بصمة المشتري
            customer: {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                wilaya: document.getElementById('wilaya').value
            }
        };

        const res = await fetch('/api/order', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
        const r = await res.json();

        if(r.success) {
            document.body.innerHTML = '<div class="h-screen flex items-center justify-center text-2xl font-bold text-green-600">تم استلام طلبك بنجاح! 🎉</div>';
        } else {
            alert(r.msg || 'خطأ');
            btn.disabled = false; btn.innerText = 'تأكيد الطلب ✅';
        }
    }
</script>
</body>
</html>
