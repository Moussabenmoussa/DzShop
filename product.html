<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العرض</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-[Tajawal]">

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-lg relative pb-20">
        <img id="pImg" class="w-full h-80 object-cover bg-gray-200">
        
        <div class="p-6">
            <h1 id="pTitle" class="text-2xl font-black text-slate-800 mb-2">...</h1>
            <div class="text-3xl font-bold text-blue-600 mb-6"><span id="pPrice">...</span> د.ج</div>
            
            <p id="pDesc" class="text-gray-600 text-sm leading-relaxed mb-8 whitespace-pre-line">...</p>

            <div class="bg-gray-50 p-4 rounded-xl border mb-6">
                <h3 class="font-bold mb-3">مهتم بهذا العرض؟ 😍</h3>
                <p class="text-xs text-gray-500 mb-3">اترك معلوماتك ليتصل بك صاحب العرض مباشرة.</p>
                
                <form onsubmit="order(event)" class="space-y-3">
                    <input id="name" required class="w-full border p-3 rounded-lg outline-none focus:border-blue-500" placeholder="الاسم">
                    <input id="phone" type="tel" required class="w-full border p-3 rounded-lg text-left ltr" placeholder="رقم الهاتف">
                    <input id="wilaya" required class="w-full border p-3 rounded-lg" placeholder="الولاية">
                    <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">أنا مهتم (طلب اتصال) 📞</button>
                </form>
            </div>
        </div>
    </div>

<script>
    const pid = window.location.pathname.split('/').pop();
    // بصمة الجهاز
    const fp = Math.abs(((navigator.userAgent+screen.width).split("").reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0))).toString(16);

    fetch('/api/public/product/' + pid).then(r=>r.json()).then(p => {
        if(!p.title) return document.body.innerHTML = '<div class="text-center mt-20">العرض غير موجود</div>';
        document.title = p.title;
        document.getElementById('pImg').src = p.image || 'https://via.placeholder.com/500';
        document.getElementById('pTitle').innerText = p.title;
        document.getElementById('pPrice').innerText = p.price;
        document.getElementById('pDesc').innerText = p.desc;
    });

    async function order(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.innerText = 'جاري الإرسال...';

        const data = {
            listingId: pid,
            buyerName: document.getElementById('name').value,
            buyerPhone: document.getElementById('phone').value,
            buyerWilaya: document.getElementById('wilaya').value,
            fingerprint: fp
        };

        const res = await fetch('/api/lead/create', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        const r = await res.json();

        if(r.success) {
            alert('تم إرسال طلبك للبائع! سيتصل بك قريباً.');
            location.reload();
        } else {
            alert(r.msg);
            btn.disabled = false; btn.innerText = 'أنا مهتم (طلب اتصال) 📞';
        }
    }
</script>
</body>
</html>
