<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرسائل | DzMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #fff; height: 100vh; overflow: hidden; }
        .chat-item { transition: background 0.2s; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
        .chat-item:hover { background-color: #f9fafb; }
        .active-chat { background-color: #f0fdf4; border-right: 3px solid #22c55e; }
        .bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 14px; position: relative; word-wrap: break-word; line-height: 1.4; }
        .me { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-bottom-left-radius: 4px; margin-left: auto; }
        .other { background: #f0f2f5; color: black; border-bottom-right-radius: 4px; margin-right: auto; }
        .invoice-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; width: 240px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .online-dot { width: 12px; height: 12px; background: #31a24c; border: 2px solid white; border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="flex flex-col md:flex-row">

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-4 right-4 left-4 md:left-auto md:w-80 z- p-4 rounded-xl shadow-lg"></div>

    <!-- Custom Modal -->
    <div id="customModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6">
                <h3 id="modalTitle" class="font-bold text-lg text-center mb-2"></h3>
                <p id="modalMessage" class="text-gray-600 text-sm text-center mb-6"></p>
                <div id="modalButtons" class="flex gap-3"></div>
            </div>
        </div>
    </div>

    <!-- 1. قائمة المحادثات -->
    <div id="inboxView" class="w-full md:w-1/3 md:border-l h-screen flex flex-col bg-white z-10">
        <div class="h-16 flex items-center justify-between px-4 border-b bg-white">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='/dashboard'" class="md:hidden text-gray-600 w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100"><i class="fas fa-arrow-right"></i></button>
                <h1 class="text-xl font-black">الدردشات</h1>
            </div>
            <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center"><i class="fas fa-edit text-purple-600"></i></div>
        </div>
        
        <div class="p-3">
            <input type="text" id="searchInput" oninput="searchChats()" placeholder="بحث في الرسائل..." class="w-full bg-gray-100 rounded-full px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-200">
        </div>

        <div id="chatList" class="flex-1 overflow-y-auto">
            <div class="text-center py-10 text-gray-400"><i class="fas fa-circle-notch fa-spin"></i> جاري التحميل...</div>
        </div>
    </div>

    <!-- 2. غرفة المحادثة -->
    <div id="roomView" class="hidden md:flex w-full md:w-2/3 h-screen flex-col bg-white fixed md:relative inset-0 z-20">
        <div class="h-16 border-b flex items-center justify-between px-4 bg-white shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="closeChat()" class="md:hidden text-gray-600 w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100"><i class="fas fa-arrow-right text-lg"></i></button>
                <div class="relative">
                    <img id="chatAvatar" src="https://via.placeholder.com/100" class="w-10 h-10 rounded-full object-cover border-2 border-purple-200">
                    <div class="online-dot"></div>
                </div>
                <div>
                    <h3 id="chatName" class="font-bold text-sm leading-tight">...</h3>
                    <p class="text-[10px] text-green-600 font-bold">متصل الآن</p>
                </div>
            </div>
            
            <button onclick="openInvoiceModal()" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-md hover:shadow-lg transition flex items-center gap-2">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="hidden sm:inline">فاتورة</span>
            </button>
        </div>

        <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50"></div>

        <div class="p-3 border-t bg-white flex items-center gap-2">
            <button class="text-purple-500 p-2 hover:bg-purple-50 rounded-full"><i class="fas fa-image text-lg"></i></button>
            <input id="msgInput" type="text" placeholder="اكتب رسالة..." class="flex-1 bg-gray-100 rounded-full px-5 py-3 text-sm outline-none focus:ring-2 focus:ring-purple-200 transition" onkeypress="if(event.key==='Enter')sendMsg('text')">
            <button onclick="sendMsg('text')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-3 rounded-full shadow-md hover:shadow-lg transition"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Invoice Modal -->
    <div id="invoiceModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs p-6 rounded-2xl shadow-2xl">
            <h3 class="font-bold text-center mb-1 text-lg">إنشاء فاتورة بيع 🧾</h3>
            <p class="text-center text-xs text-gray-500 mb-4">سيتم حجز المبلغ عند الدفع (Escrow)</p>
            
            <div class="bg-gray-50 p-4 rounded-xl mb-4 border border-gray-200">
                <label class="text-xs font-bold text-gray-500 block mb-2">المبلغ المطلوب ($)</label>
                <input id="invAmount" type="number" min="1" class="w-full bg-transparent font-black text-3xl text-center outline-none text-gray-800" placeholder="0.00">
            </div>
            
            <button onclick="sendMsg('invoice')" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition">إرسال الفاتورة</button>
            <button onclick="closeInvoiceModal()" class="w-full mt-3 text-gray-400 text-sm font-bold hover:text-gray-600 transition">إلغاء</button>
        </div>
    </div>

    <script>
        let USER = null;
        let CURRENT_CHAT_ID = null;
        let CURRENT_CHAT_TITLE = null;
        let POLLING_INTERVAL = null;
        let allChats = [];
    
        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if(!u) return window.location.href = '/';
            USER = JSON.parse(u);
            
            loadInbox();
            startPolling();
    
            if(window.location.hash.includes('id=')) {
                const id = window.location.hash.split('=');
                openChat(id);
            }
        };
    
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const colors = { error: 'bg-red-500', success: 'bg-green-500', info: 'bg-purple-500' };
            toast.className = `fixed top-4 right-4 left-4 md:left-auto md:w-80 z-[60] p-4 rounded-xl shadow-lg text-white ${colors[type]}`;
            toast.innerHTML = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    
        function showModal(title, message, buttons) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalButtons').innerHTML = buttons.map(b => 
                `<button onclick="${b.action}" class="${b.class} flex-1 py-3 rounded-xl font-bold transition">${b.text}</button>`
            ).join('');
            document.getElementById('customModal').classList.remove('hidden');
        }
    
        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }
    
        async function loadInbox() {
            try {
                const res = await fetch('/api/chats/' + USER._id);
                allChats = await res.json();
                renderChats(allChats);
            } catch(e) { console.error(e); }
        }
    
        function renderChats(chats) {
            const list = document.getElementById('chatList');
            if(!chats.length) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400 text-sm"><i class="fas fa-comments text-4xl mb-3 block"></i>لا توجد محادثات بعد</div>';
                return;
            }
    
            list.innerHTML = chats.map(c => {
                const name = c.otherUser?.name || c.listingTitle;
                const avatar = c.otherUser?.avatar || `https://ui-avatars.com/api/?name=${name}&background=random`;
                const unread = c.unreadCounts?.[USER._id] || 0;
                return `
                <div class="chat-item p-3 flex gap-3 ${CURRENT_CHAT_ID === c._id ? 'active-chat' : ''}" onclick="openChat('${c._id}', '${name}', '${avatar}')">
                    <div class="relative flex-shrink-0">
                        <img src="${avatar}" class="w-12 h-12 rounded-full object-cover border-2 border-gray-100">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-1">
                            <h4 class="font-bold text-sm truncate text-gray-900">${name}</h4>
                            <span class="text-[10px] text-gray-400 flex-shrink-0">${formatTime(c.lastMessageDate)}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate ${unread > 0 ? 'font-bold text-gray-800' : ''}">${c.lastMessage || 'مرفق'}</p>
                    </div>
                    ${unread > 0 ? `<div class="w-5 h-5 bg-purple-600 text-white text-[10px] rounded-full flex items-center justify-center font-bold self-center">${unread}</div>` : ''}
                </div>`;
            }).join('');
        }
    
        function searchChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChats.filter(c => 
                (c.otherUser?.name || c.listingTitle || '').toLowerCase().includes(query) ||
                (c.lastMessage || '').toLowerCase().includes(query)
            );
            renderChats(filtered);
        }
    
        function formatTime(date) {
            const d = new Date(date);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) {
                return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
            return d.toLocaleDateString('ar');
        }
    
        async function openChat(chatId, title, avatar) {
            CURRENT_CHAT_ID = chatId;
            CURRENT_CHAT_TITLE = title;
            
            document.getElementById('inboxView').classList.add('hidden');
            document.getElementById('inboxView').classList.add('md:flex');
            document.getElementById('roomView').classList.remove('hidden');
            document.getElementById('roomView').classList.add('flex');
            
            document.getElementById('chatName').innerText = title || 'محادثة';
            document.getElementById('chatAvatar').src = avatar || 'https://via.placeholder.com/100';
    
            loadMessages();
            loadInbox();
        }
    
        function closeChat() {
            CURRENT_CHAT_ID = null;
            document.getElementById('roomView').classList.add('hidden');
            document.getElementById('roomView').classList.remove('flex');
            document.getElementById('inboxView').classList.remove('hidden');
            document.getElementById('inboxView').classList.remove('md:flex');
        }
    
        async function loadMessages() {
            if(!CURRENT_CHAT_ID) return;
            try {
                const res = await fetch(`/api/chat/history/${CURRENT_CHAT_ID}?userId=${USER._id}`);
                const msgs = await res.json();
                
                const area = document.getElementById('messagesArea');
                area.innerHTML = msgs.length ? msgs.map(m => renderMessage(m)).join('') : '<div class="text-center text-gray-400 py-10"><i class="fas fa-comments text-3xl mb-2 block"></i>ابدأ المحادثة...</div>';
                area.scrollTop = area.scrollHeight;
            } catch(e) {}
        }
    
        function renderMessage(m) {
            const isMe = m.senderId === USER._id;
            
            if (m.type === 'invoice') {
                const statusColor = m.meta.status === 'paid' ? 'text-green-600' : 'text-orange-500';
                const statusText = m.meta.status === 'paid' ? '✅ مدفوعة' : '⏳ بانتظار الدفع';
                const btn = (!isMe && m.meta.status === 'pending') 
                    ? `<button onclick="payInvoice('${m._id}', ${m.meta.amount})" class="w-full mt-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2.5 rounded-lg text-xs font-bold hover:shadow-lg transition">دفع وحجز (${m.meta.amount}$)</button>` 
                    : '';
    
                return `
                <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'} mb-3">
                    <div class="invoice-card">
                        <div class="flex items-center justify-between border-b pb-2 mb-2">
                            <span class="font-bold text-sm">فاتورة خدمة</span>
                            <i class="fas fa-receipt text-purple-400"></i>
                        </div>
                        <div class="text-center py-3">
                            <div class="text-3xl font-black text-gray-800">${m.meta.amount}<span class="text-sm text-gray-400 mr-1">$</span></div>
                            <div class="text-xs font-bold ${statusColor} mt-2">${statusText}</div>
                        </div>
                        ${btn}
                    </div>
                </div>`;
            }
    
            return `
            <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'} mb-1">
                <div class="bubble ${isMe ? 'me' : 'other'}">
                    ${escapeHtml(m.content)}
                    <div class="text-[9px] opacity-60 text-right mt-1">${formatTime(m.date)}</div>
                </div>
            </div>`;
        }
    
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    
        async function sendMsg(type) {
            let content = '';
            let amount = 0;
    
            if(type === 'text') {
                content = document.getElementById('msgInput').value.trim();
                if(!content) return;
            } else {
                amount = parseFloat(document.getElementById('invAmount').value);
                if(!amount || amount <= 0) return showToast('أدخل مبلغاً صحيحاً', 'error');
                content = 'فاتورة';
            }
    
            try {
                await fetch('/api/chat/send', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chatId: CURRENT_CHAT_ID, senderId: USER._id, type, content, amount })
                });
    
                document.getElementById('msgInput').value = '';
                closeInvoiceModal();
                loadMessages();
            } catch(e) {
                showToast('فشل في إرسال الرسالة', 'error');
            }
        }
    
        async function payInvoice(msgId, amount) {
            showModal('تأكيد الدفع', `هل توافق على دفع ${amount}$ وحجز المبلغ؟`, [
                { text: 'إلغاء', class: 'bg-gray-100 text-gray-600 hover:bg-gray-200', action: 'closeModal()' },
                { text: 'دفع الآن', class: 'bg-gradient-to-r from-purple-600 to-pink-600 text-white', action: `confirmPayment('${msgId}')` }
            ]);
        }
    
        async function confirmPayment(msgId) {
            closeModal();
            try {
                const res = await fetch('/api/order/pay-invoice', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ messageId: msgId, buyerId: USER._id }) 
                });
                const d = await res.json();
                if(d.success) { 
                    showToast('تم الدفع بنجاح! 🎉', 'success'); 
                    loadMessages(); 
                } else {
                    showToast(d.msg || 'فشل الدفع', 'error');
                }
            } catch(e) {
                showToast('خطأ في الاتصال', 'error');
            }
        }
    
        function startPolling() {
            POLLING_INTERVAL = setInterval(() => {
                if(CURRENT_CHAT_ID) loadMessages();
                loadInbox();
            }, 3000);
        }
    
        function openInvoiceModal() { 
            document.getElementById('invoiceModal').classList.remove('hidden'); 
            document.getElementById('invAmount').value = '';
            document.getElementById('invAmount').focus();
        }
        
        function closeInvoiceModal() { 
            document.getElementById('invoiceModal').classList.add('hidden'); 
        }
    </script>
</body>
</html>
