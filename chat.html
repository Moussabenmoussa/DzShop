<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرسائل | DzMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; height: 100vh; background: #fff; }
        
        /* شاشات */
        .view-section { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform 0.3s ease-in-out; background: #fff; }
        .view-hidden { transform: translateX(100%); } /* إخفاء لليمين */
        
        /* خلفية الدردشة */
        .chat-bg {
            background-color: #efeae2;
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
            opacity: 1;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="inboxView" class="view-section z-10">
        <header class="bg-white p-4 border-b flex items-center justify-between shadow-sm h-16">
            <h1 class="text-2xl font-black text-gray-800">الدردشات</h1>
            <button onclick="window.location.href='/dashboard'" class="text-gray-500 hover:text-red-600">
                <i class="fas fa-home text-xl"></i>
            </button>
        </header>

        <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <div class="text-center py-20 text-gray-400">
                <i class="fas fa-circle-notch fa-spin text-2xl"></i>
                <p class="mt-2 text-sm">جاري تحميل المحادثات...</p>
            </div>
        </div>
    </div>

    <div id="roomView" class="view-section view-hidden z-20">
        <header class="bg-[#075e54] text-white p-3 flex items-center gap-3 shadow-md h-16 flex-shrink-0">
            <button onclick="closeChat()" class="p-2 rounded-full hover:bg-white/10">
                <i class="fas fa-arrow-right text-lg"></i>
            </button>
            <img id="roomAvatar" src="" class="w-10 h-10 rounded-full bg-white/20 object-cover">
            <div class="flex-1">
                <h3 id="roomName" class="font-bold text-sm leading-tight">...</h3>
                <p class="text-[10px] text-white/80">متصل الآن</p>
            </div>
            <button onclick="document.getElementById('invoiceModal').classList.remove('hidden')" class="p-2">
                <i class="fas fa-file-invoice-dollar"></i>
            </button>
        </header>

        <main id="chatBody" class="flex-1 overflow-y-auto p-4 space-y-2 chat-bg no-scrollbar">
            </main>

        <footer class="bg-white p-2 border-t flex items-center gap-2 h-16 flex-shrink-0">
            <button class="text-gray-400 p-2"><i class="fas fa-plus text-xl"></i></button>
            <div class="flex-1 bg-gray-100 rounded-full px-4 py-2">
                <input id="msgInput" type="text" placeholder="اكتب رسالة..." class="w-full bg-transparent border-none outline-none text-sm"
                       onkeypress="if(event.key === 'Enter') sendMessage('text')">
            </div>
            <button onclick="sendMessage('text')" class="w-10 h-10 bg-[#008a7c] text-white rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-paper-plane text-sm pr-1 pt-1"></i>
            </button>
        </footer>
    </div>

    <div id="invoiceModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 animate-pulse">
            <h3 class="text-center font-bold mb-4">إرسال فاتورة</h3>
            <input id="invAmount" type="number" placeholder="المبلغ (دج)" class="w-full bg-gray-100 p-3 rounded-xl mb-4 text-center text-xl font-bold outline-none">
            <button onclick="sendMessage('invoice')" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">إرسال</button>
            <button onclick="document.getElementById('invoiceModal').classList.add('hidden')" class="w-full mt-2 text-gray-500 text-sm">إلغاء</button>
        </div>
    </div>

    <script>
        let USER = null;
        let ACTIVE_CHAT_ID = null;
        let POLLING_TIMER = null;

        // 1. التشغيل والتحقق
        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if(!u) return window.location.href = '/dashboard';
            USER = JSON.parse(u);

            // هل هناك ID في الرابط؟
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('id');

            loadInbox(); // تحميل القائمة دائماً في الخلفية

            if(urlId) {
                openChat(urlId, 'جاري التحميل...'); // فتح المحادثة مباشرة
            }
        };

        // 2. تحميل القائمة (Inbox)
        async function loadInbox() {
            try {
                const res = await fetch('/api/chats/' + USER._id);
                const chats = await res.json();
                const list = document.getElementById('chatList');

                if(!chats.length) {
                    list.innerHTML = `<div class="text-center py-20 text-gray-400">لا توجد محادثات<br>ابدأ التواصل من السوق</div>`;
                    return;
                }

                list.innerHTML = chats.map(c => {
                    const partner = c.buyerId === USER._id ? c.sellerName : c.buyerName; // تحديد اسم الطرف الآخر
                    const title = c.listingTitle || partner || 'مستخدم';
                    
                    return `
                    <div onclick="openChat('${c._id}', '${title}')" class="flex items-center gap-3 p-3 bg-white hover:bg-gray-50 border-b cursor-pointer transition">
                        <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-500 text-lg">
                            ${title.charAt(0)}
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between">
                                <h3 class="font-bold text-gray-800">${title}</h3>
                                <span class="text-[10px] text-gray-400">${new Date(c.lastMessageDate).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                            <p class="text-sm text-gray-500 truncate w-64">${c.lastMessage || '...'}</p>
                        </div>
                    </div>`;
                }).join('');
            } catch(e) { console.error(e); }
        }

        // 3. فتح المحادثة (Room Logic)
        async function openChat(chatId, name) {
            ACTIVE_CHAT_ID = chatId;
            document.getElementById('roomName').innerText = name;
            document.getElementById('roomAvatar').src = `https://ui-avatars.com/api/?name=${name}&background=random`;
            
            // التبديل للشاشة الثانية
            document.getElementById('inboxView').classList.add('hidden'); // إخفاء القائمة في الموبايل
            document.getElementById('roomView').classList.remove('view-hidden'); // إظهار الغرفة
            
            // بدء جلب الرسائل
            fetchMessages();
            if(POLLING_TIMER) clearInterval(POLLING_TIMER);
            POLLING_TIMER = setInterval(fetchMessages, 2000); // تحديث كل ثانيتين

            // تحديث الرابط (بدون ريفريش)
            window.history.pushState({}, '', '?id=' + chatId);
        }

        function closeChat() {
            ACTIVE_CHAT_ID = null;
            if(POLLING_TIMER) clearInterval(POLLING_TIMER);
            
            document.getElementById('roomView').classList.add('view-hidden');
            document.getElementById('inboxView').classList.remove('hidden');
            
            window.history.pushState({}, '', '/chat'); // تنظيف الرابط
            loadInbox(); // تحديث القائمة لرؤية آخر رسالة
        }

        // 4. جلب وعرض الرسائل
        async function fetchMessages() {
            if(!ACTIVE_CHAT_ID) return;
            try {
                const res = await fetch(`/api/chat/history/${ACTIVE_CHAT_ID}`);
                const msgs = await res.json();
                const container = document.getElementById('chatBody');

                const html = msgs.map(m => {
                    const isMe = m.senderId === USER._id;
                    let content = m.content;

                    // تنسيق الفاتورة
                    if(m.type === 'invoice') {
                        content = `
                        <div class="bg-white p-2 rounded border-l-4 border-green-500 w-48">
                            <div class="text-xs text-green-700 font-bold mb-1">🧾 فاتورة</div>
                            <div class="text-2xl font-black">${m.meta.amount} دج</div>
                            ${m.meta.status === 'paid' 
                                ? '<div class="text-green-600 font-bold text-xs mt-1">✅ تم الدفع</div>' 
                                : (!isMe ? `<button onclick="payInvoice('${m._id}', ${m.meta.amount})" class="w-full bg-green-600 text-white text-xs py-1 rounded mt-2">دفع</button>` : '<div class="text-orange-500 text-xs mt-1">⏳ بانتظار الدفع</div>')}
                        </div>`;
                    }

                    return `
                    <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] px-3 py-2 rounded-lg text-sm shadow-sm mb-1 ${isMe ? 'bg-[#d9fdd3] rounded-tl-lg rounded-tr-none' : 'bg-white rounded-tr-lg rounded-tl-none'}">
                            ${content}
                            <span class="text-[9px] text-gray-500 block text-left mt-1">${new Date(m.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                    </div>`;
                }).join('');

                // تحديث فقط إذا تغير المحتوى (لمنع الوميض)
                if(container.innerHTML !== html) {
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight; // نزول للأسفل
                }
            } catch(e) {}
        }

        // 5. إرسال رسالة
        async function sendMessage(type) {
            let content = '', amount = 0;
            if(type === 'text') {
                const inp = document.getElementById('msgInput');
                content = inp.value.trim();
                if(!content) return;
                inp.value = '';
            } else {
                amount = document.getElementById('invAmount').value;
                if(!amount) return alert('أدخل المبلغ');
                content = 'فاتورة';
                document.getElementById('invoiceModal').classList.add('hidden');
            }

            try {
                await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chatId: ACTIVE_CHAT_ID, senderId: USER._id, type, content, amount })
                });
                fetchMessages(); // تحديث فوري
            } catch(e) { alert('فشل الإرسال'); }
        }

        // 6. دفع الفاتورة
        async function payInvoice(msgId, amount) {
            if(!confirm(`دفع ${amount} دج؟`)) return;
            try {
                const res = await fetch('/api/order/pay-invoice', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ messageId: msgId, buyerId: USER._id })
                });
                const d = await res.json();
                if(d.success) { fetchMessages(); alert('تم الدفع ✅'); }
                else alert(d.msg || 'رصيد غير كافٍ');
            } catch(e) { alert('خطأ'); }
        }
    </script>
</body>
</html>
