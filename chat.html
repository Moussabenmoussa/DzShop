<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المحادثة | DzMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; background: #efeae2; }
        
        /* خلفية واتساب */
        .chat-bg {
            background-color: #efeae2;
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
            opacity: 0.8;
        }

        /* تحسين شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { width: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #bbb; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-[#075e54] text-white p-3 flex items-center justify-between shadow-md z-50 flex-shrink-0 h-16">
        <div class="flex items-center gap-3">
            <button onclick="window.history.back()" class="md:hidden">
                <i class="fas fa-arrow-right text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <img id="chatAvatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full border-2 border-white/20">
                <div>
                    <h3 id="chatName" class="font-bold text-sm leading-tight">جاري التحميل...</h3>
                    <p class="text-[10px] text-white/80 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> متصل الآن
                    </p>
                </div>
            </div>
        </div>
        <button onclick="document.getElementById('invoiceModal').classList.remove('hidden')" class="bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
            <i class="fas fa-file-invoice-dollar text-lg"></i>
        </button>
    </header>

    <main id="chatBody" class="flex-1 overflow-y-auto p-4 space-y-3 chat-bg relative scroll-smooth no-scrollbar">
        <div id="loader" class="flex justify-center mt-10">
            <i class="fas fa-circle-notch fa-spin text-gray-400 text-2xl"></i>
        </div>
    </main>

    <footer class="bg-white p-2 flex items-center gap-2 border-t flex-shrink-0 z-50 pb-safe">
        <button class="text-gray-500 p-2"><i class="fas fa-plus text-xl"></i></button>
        
        <div class="flex-1 bg-gray-100 rounded-full flex items-center px-4 py-2">
            <input id="msgInput" type="text" placeholder="اكتب رسالة..." 
                   class="w-full bg-transparent border-none outline-none text-gray-800 text-sm h-8"
                   onkeypress="if(event.key === 'Enter') sendMsg('text')">
        </div>

        <button onclick="sendMsg('text')" class="bg-[#008a7c] text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:bg-[#006b60] transition transform active:scale-90">
            <i class="fas fa-paper-plane text-sm pt-1 pr-1"></i>
        </button>
    </footer>

    <div id="invoiceModal" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xs rounded-xl p-5 animate-scaleIn">
            <h3 class="text-center font-bold mb-4">إنشاء فاتورة</h3>
            <input id="invAmount" type="number" placeholder="المبلغ (دج)" class="w-full bg-gray-50 p-3 rounded-lg border mb-3 text-center text-xl font-bold">
            <button onclick="sendMsg('invoice')" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mb-2">إرسال</button>
            <button onclick="document.getElementById('invoiceModal').classList.add('hidden')" class="w-full text-gray-500 py-2">إلغاء</button>
        </div>
    </div>

    <script>
        let USER = null;
        let CHAT_ID = null;
        
        // 1. التهيئة عند التشغيل
        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if(!u) return window.location.href = '/';
            USER = JSON.parse(u);

            // جلب ID المحادثة من الرابط أو الهاش
            const urlParams = new URLSearchParams(window.location.search);
            CHAT_ID = urlParams.get('id') || urlParams.get('chatId');
            
            if(window.location.hash.includes('id=')) {
                CHAT_ID = window.location.hash.split('id=')[1];
            }

            if(!CHAT_ID) {
                alert('رابط المحادثة غير صحيح');
                window.location.href = '/dashboard';
                return;
            }

            // إعداد الواجهة
            document.getElementById('chatName').innerText = "محادثة #" + CHAT_ID.substr(-4);
            document.getElementById('chatAvatar').src = `https://ui-avatars.com/api/?name=${CHAT_ID}&background=random`;

            // بدء النظام
            loadMessages();
            setInterval(loadMessages, 2000); // تحديث كل ثانيتين
        };

        // 2. دالة جلب الرسائل (Polling)
        async function loadMessages() {
            if(!CHAT_ID) return;
            try {
                // نستخدم الرابط الصحيح الذي أكدت لي وجوده في Server.js
                const res = await fetch(`/api/chat/history/${CHAT_ID}`);
                const msgs = await res.json();
                
                const container = document.getElementById('chatBody');
                document.getElementById('loader').classList.add('hidden');

                // بناء HTML الرسائل
                const html = msgs.map(m => {
                    const isMe = m.senderId === USER._id;
                    
                    // تصميم الفقاعة (Bubble)
                    let content = m.content;
                    if(m.type === 'invoice') {
                        const isPaid = m.meta.status === 'paid';
                        content = `
                        <div class="bg-white/90 p-2 rounded border-l-4 border-green-500 w-48">
                            <div class="text-xs font-bold text-green-700 mb-1">🧾 فاتورة خدمة</div>
                            <div class="text-2xl font-black text-gray-800">${m.meta.amount} دج</div>
                            <div class="text-[10px] mt-1 ${isPaid?'text-green-600':'text-orange-500'} font-bold">
                                ${isPaid ? '✅ تم الدفع' : '⏳ بانتظار الدفع'}
                            </div>
                            ${!isMe && !isPaid ? `<button onclick="payInvoice('${m._id}',${m.meta.amount})" class="w-full mt-2 bg-green-600 text-white text-xs py-1 rounded">دفع الآن</button>` : ''}
                        </div>`;
                    }

                    return `
                    <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                        <div class="max-w-[75%] px-3 py-2 rounded-lg shadow-sm text-sm relative ${isMe ? 'bg-[#dcf8c6] rounded-tl-lg rounded-tr-none' : 'bg-white rounded-tl-none rounded-tr-lg'}">
                            ${content}
                            <div class="text-[9px] text-gray-500 mt-1 text-left flex items-center justify-end gap-1">
                                ${new Date(m.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                                ${isMe ? '<i class="fas fa-check-double text-blue-500"></i>' : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');

                // تحديث فقط إذا تغير المحتوى (لتجنب الوميض)
                // نقوم بإزالة اللودر من المقارنة
                const currentContent = container.innerHTML.replace(/<div id="loader".*?<\/div>/, ''); 
                
                if (container.querySelectorAll('.flex').length !== msgs.length) {
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight; // نزول للأسفل
                }

            } catch(e) { console.error("Polling Error:", e); }
        }

        // 3. دالة الإرسال
        async function sendMsg(type) {
            let content = '';
            let amount = 0;

            if(type === 'text') {
                const input = document.getElementById('msgInput');
                content = input.value.trim();
                if(!content) return;
                input.value = ''; // تفريغ الحقل فوراً
            } else {
                amount = document.getElementById('invAmount').value;
                if(!amount) return alert('أدخل المبلغ');
                content = 'فاتورة';
                document.getElementById('invoiceModal').classList.add('hidden');
            }

            try {
                // إرسال للسيرفر
                await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chatId: CHAT_ID,
                        senderId: USER._id,
                        type: type,
                        content: content,
                        amount: amount
                    })
                });
                
                loadMessages(); // تحديث فوري
            } catch(e) { alert('فشل الإرسال'); }
        }

        // 4. دالة دفع الفاتورة
        async function payInvoice(msgId, amount) {
            if(!confirm(`دفع ${amount} دج؟`)) return;
            try {
                const res = await fetch('/api/order/pay-invoice', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ messageId: msgId, buyerId: USER._id })
                });
                const d = await res.json();
                if(d.success) { 
                    loadMessages(); 
                    alert('تم الدفع بنجاح ✅');
                } else {
                    alert(d.msg || 'خطأ');
                }
            } catch(e) { alert('خطأ في الاتصال'); }
        }
    </script>
</body>
</html>
