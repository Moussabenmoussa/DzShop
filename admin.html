<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المنصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Tajawal',sans-serif;background:#0f172a;color:white}</style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-3xl font-bold text-blue-400">💎 الإدارة المالية</h1>
        <div class="flex gap-4 text-sm text-slate-400">
            <div>المستخدمين: <span id="sUsers" class="text-white font-bold">...</span></div>
            <div>العروض: <span id="sListings" class="text-white font-bold">...</span></div>
            <div>الطلبات: <span id="sLeads" class="text-white font-bold">...</span></div>
        </div>
    </div>

    <h2 class="text-xl font-bold mb-4 text-yellow-400">💸 طلبات شحن الرصيد (المعلقة)</h2>
    <div id="depositList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-slate-500 col-span-full">جاري التحميل...</p>
    </div>

    <div id="imgModal" class="fixed inset-0 bg-black/90 hidden justify-center items-center z-50 p-4" onclick="this.style.display='none'">
        <img id="zoomImg" src="" class="max-w-full max-h-full rounded-lg shadow-2xl border border-slate-600">
    </div>

<script>
    // 1. جلب الإحصائيات
    fetch('/api/admin/stats').then(r=>r.json()).then(d => {
        document.getElementById('sUsers').innerText = d.users;
        document.getElementById('sListings').innerText = d.listings;
        document.getElementById('sLeads').innerText = d.leads;
    });

    // 2. جلب طلبات الشحن
    async function loadDeposits() {
        const res = await fetch('/api/admin/deposits');
        const list = await res.json();
        
        const container = document.getElementById('depositList');
        if(list.length === 0) {
            container.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10 bg-slate-800 rounded-xl">لا توجد طلبات شحن جديدة ✅</p>';
            return;
        }

        container.innerHTML = list.map(t => `
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <div class="font-bold text-lg">${t.userName}</div>
                        <div class="text-xs text-slate-400">ID: ${t.userId.substr(-4)}</div>
                    </div>
                    <div class="text-green-400 font-bold text-xl">+${t.amount} دج</div>
                </div>
                
                <div class="mb-4 h-32 bg-slate-900 rounded-lg overflow-hidden cursor-pointer relative group" onclick="showImg('${t.proof}')">
                    <img src="${t.proof}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition">
                    <div class="absolute inset-0 flex items-center justify-center text-xs text-white opacity-0 group-hover:opacity-100 bg-black/50 transition">اضغط للتكبير 🔍</div>
                </div>

                <div class="flex gap-2">
                    <button onclick="process('${t._id}', 'approve')" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded-lg font-bold text-sm">موافقة ✅</button>
                    <button onclick="process('${t._id}', 'reject')" class="flex-1 bg-red-600 hover:bg-red-500 py-2 rounded-lg font-bold text-sm">رفض ❌</button>
                </div>
                <div class="text-[10px] text-slate-500 mt-2 text-center">${new Date(t.date).toLocaleString()}</div>
            </div>
        `).join('');
    }

    // 3. معالجة الطلب (موافقة/رفض)
    async function process(id, action) {
        if(!confirm(action === 'approve' ? 'هل وصلك المال فعلاً؟ سيتم إضافة الرصيد للمستخدم.' : 'رفض الطلب؟')) return;
        
        await fetch('/api/admin/approve-deposit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ transId: id, action })
        });
        loadDeposits(); // تحديث القائمة
    }

    function showImg(url) {
        document.getElementById('zoomImg').src = url;
        document.getElementById('imgModal').style.display = 'flex';
    }

    loadDeposits();
</script>
</body>
</html>
