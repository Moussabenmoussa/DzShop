<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم سينما بلس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: white; }</style>
</head>
<body class="p-6 max-w-3xl mx-auto">

    <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
        <h1 class="text-2xl font-black text-pink-500"><i class="fas fa-sliders-h"></i> إعدادات التطبيق</h1>
        <a href="/" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm transition">معاينة التطبيق <i class="fas fa-external-link-alt"></i></a>
    </div>

    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-6 shadow-lg">
        <label class="block text-sm text-gray-400 mb-2 font-bold">اسم التطبيق</label>
        <input type="text" id="appTitle" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg text-white focus:border-pink-500 outline-none transition" placeholder="سينما بلس">
    </div>

    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-6 shadow-lg">
        <label class="block text-sm text-gray-400 mb-2 font-bold">إضافة فيديو جديد (YouTube ID)</label>
        <div class="flex gap-2 mb-6">
            <input type="text" id="newVid" class="flex-1 bg-slate-900 border border-slate-600 p-3 rounded-lg text-white text-left ltr focus:border-pink-500 outline-none" placeholder="مثال: TrgR4aYdSZA">
            <button onclick="addVideo()" class="bg-pink-600 hover:bg-pink-500 px-6 rounded-lg font-bold transition shadow-lg">
                <i class="fas fa-plus"></i> إضافة
            </button>
        </div>
        
        <div class="flex justify-between items-center mb-2">
            <label class="text-sm text-gray-400 font-bold">قائمة الفيديوهات (<span id="vidCount">0</span>)</label>
            <button onclick="clearAll()" class="text-red-400 text-xs hover:underline">حذف الكل</button>
        </div>
        
        <div id="videoList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
            </div>
    </div>

    <div class="sticky bottom-4">
        <button onclick="saveChanges()" id="saveBtn" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-bold py-4 rounded-xl text-lg shadow-xl transition transform active:scale-95 flex justify-center items-center gap-2">
            <span>حفظ التعديلات ونشرها</span> <i class="fas fa-rocket"></i>
        </button>
    </div>

<script>
    let videos = [];

    // 1. جلب البيانات عند التحميل
    fetch('/api/data').then(r => r.json()).then(d => {
        document.getElementById('appTitle').value = d.title;
        videos = d.videos || [];
        renderList();
    });

    // إضافة فيديو
    function addVideo() {
        const input = document.getElementById('newVid');
        let id = input.value.trim();
        
        // استخراج الـ ID إذا وضع المستخدم رابطاً كاملاً
        if (id.includes('v=')) {
            id = id.split('v=')[1].split('&')[0];
        } else if (id.includes('youtu.be/')) {
            id = id.split('youtu.be/')[1].split('?')[0];
        }

        if(!id) return;
        videos.unshift(id);
        input.value = '';
        renderList();
    }

    // حذف فيديو
    function removeVideo(index) {
        if(confirm('حذف هذا الفيديو؟')) {
            videos.splice(index, 1);
            renderList();
        }
    }

    function clearAll() {
        if(confirm('هل أنت متأكد من حذف كل الفيديوهات؟')) {
            videos = [];
            renderList();
        }
    }

    // رسم القائمة
    function renderList() {
        document.getElementById('vidCount').innerText = videos.length;
        const list = document.getElementById('videoList');
        
        list.innerHTML = videos.map((id, i) => `
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-lg border border-slate-700 hover:border-slate-500 transition group">
                <div class="flex items-center gap-4">
                    <span class="bg-slate-700 text-xs px-2 py-1 rounded text-gray-300 font-mono w-8 text-center">${videos.length - i}</span>
                    <img src="https://img.youtube.com/vi/${id}/default.jpg" class="w-12 h-9 object-cover rounded shadow-sm">
                    <a href="https://youtu.be/${id}" target="_blank" class="font-mono text-sm text-blue-400 hover:underline hover:text-blue-300">${id}</a>
                </div>
                <button onclick="removeVideo(${i})" class="text-slate-500 hover:text-red-500 px-3 py-1 transition group-hover:text-red-400">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        `).join('');
    }

    // حفظ البيانات في السيرفر
    async function saveChanges() {
        const btn = document.getElementById('saveBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
        btn.disabled = true;
        
        try {
            await fetch('/api/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('appTitle').value,
                    videos: videos
                })
            });
            btn.innerHTML = '<i class="fas fa-check-circle"></i> تم الحفظ بنجاح!';
            btn.classList.add('bg-green-700');
        } catch (e) {
            btn.innerHTML = '❌ حدث خطأ';
        }

        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
            btn.classList.remove('bg-green-700');
        }, 2000);
    }
</script>
</body>
</html>
