<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: white; }</style>
</head>
<body class="p-6 max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-center text-pink-500">⚙️ إعدادات التطبيق</h1>
    
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-6">
        <label class="block text-sm text-gray-400 mb-2">اسم التطبيق</label>
        <input type="text" id="appTitle" class="w-full bg-slate-900 border border-slate-600 p-3 rounded text-white" placeholder="سينما بلس">
    </div>

    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-6">
        <label class="block text-sm text-gray-400 mb-2">إضافة فيديو (YouTube ID)</label>
        <div class="flex gap-2 mb-4">
            <input type="text" id="newVid" class="flex-1 bg-slate-900 border border-slate-600 p-3 rounded text-white text-left ltr" placeholder="مثال: TrgR4aYdSZA">
            <button onclick="addVideo()" class="bg-blue-600 px-4 rounded font-bold hover:bg-blue-500">إضافة</button>
        </div>
        <div id="videoList" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>

    <button onclick="saveChanges()" id="saveBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">حفظ التعديلات ونشرها 🚀</button>
    <a href="/" target="_blank" class="block text-center mt-4 text-gray-500 underline text-sm">معاينة التطبيق</a>

<script>
    let videos = [];
    fetch('/api/data').then(r => r.json()).then(d => {
        document.getElementById('appTitle').value = d.title;
        videos = d.videos || [];
        renderList();
    });

    function addVideo() {
        let id = document.getElementById('newVid').value.trim();
        if(id.includes('v=')) id = id.split('v=')[1].split('&')[0];
        else if(id.includes('youtu.be/')) id = id.split('youtu.be/')[1].split('?')[0];
        
        if(!id) return;
        videos.unshift(id);
        document.getElementById('newVid').value = '';
        renderList();
    }

    function removeVideo(index) {
        videos.splice(index, 1);
        renderList();
    }

    function renderList() {
        const list = document.getElementById('videoList');
        list.innerHTML = videos.map((id, i) => `
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-700">
                <div class="flex items-center gap-3">
                    <img src="https://img.youtube.com/vi/${id}/default.jpg" class="w-10 h-8 object-cover rounded">
                    <span class="font-mono text-sm text-blue-300">${id}</span>
                </div>
                <button onclick="removeVideo(${i})" class="text-red-400 px-2">✕</button>
            </div>
        `).join('');
    }

    async function saveChanges() {
        const btn = document.getElementById('saveBtn');
        btn.innerText = 'جاري الحفظ...';
        await fetch('/api/update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: document.getElementById('appTitle').value, videos: videos })
        });
        btn.innerText = '✅ تم الحفظ!';
        setTimeout(() => btn.innerText = 'حفظ التعديلات ونشرها 🚀', 2000);
    }
</script>
</body>
</html>
