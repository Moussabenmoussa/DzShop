<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Tajawal',sans-serif;background:#1e293b;color:white;}</style>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold mb-8 text-center text-yellow-400">👑 لوحة التحكم العليا</h1>
    
    <div class="overflow-x-auto bg-slate-800 rounded-xl border border-slate-700">
        <table class="w-full text-right text-sm">
            <thead class="bg-slate-900 text-slate-400">
                <tr>
                    <th class="p-4">الاسم</th>
                    <th class="p-4">الدور</th>
                    <th class="p-4">الديون (للمنصة)</th>
                    <th class="p-4">الرصيد (للمسوق)</th>
                    <th class="p-4">الحالة</th>
                    <th class="p-4 text-center">تحكم</th>
                </tr>
            </thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>

<script>
    fetch('/api/admin/users').then(r=>r.json()).then(users => {
        document.getElementById('usersTable').innerHTML = users.map(u => `
            <tr class="border-b border-slate-700">
                <td class="p-4 font-bold">${u.name} <br> <span class="text-xs text-slate-500">${u.email}</span></td>
                <td class="p-4"><span class="px-2 py-1 rounded text-xs ${u.role==='merchant'?'bg-blue-900 text-blue-300':'bg-purple-900 text-purple-300'}">${u.role}</span></td>
                <td class="p-4 ${u.debt > 0 ? 'text-red-400 font-bold' : 'text-gray-500'}">${u.debt} دج</td>
                <td class="p-4 text-green-400">${u.balance} دج</td>
                <td class="p-4">${u.isBanned ? '<span class="text-red-500">محظور ⛔</span>' : '<span class="text-green-500">نشط</span>'}</td>
                <td class="p-4 text-center flex gap-2 justify-center">
                    ${u.debt > 0 ? `<button onclick="clearDebt('${u._id}')" class="bg-green-600 px-3 py-1 rounded hover:bg-green-500">تم الدفع 💰</button>` : ''}
                    <button onclick="toggleBan('${u._id}', ${!u.isBanned})" class="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">${u.isBanned ? 'فك الحظر' : 'حظر'}</button>
                </td>
            </tr>
        `).join('');
    });

    async function clearDebt(id) {
        if(!confirm('هل استلمت المال في CCP/BaridiMob؟')) return;
        await fetch('/api/admin/clear-debt', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ userId: id })
        });
        location.reload();
    }

    async function toggleBan(id, status) {
        await fetch('/api/admin/ban', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ userId: id, status })
        });
        location.reload();
    }
</script>
</body>
</html>
