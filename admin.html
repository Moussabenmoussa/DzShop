<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Super Admin | DzAffiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: white; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 15px; width: 95%; max-width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid #334155; }
    </style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-3xl font-bold text-yellow-400">👑 لوحة القيادة العليا</h1>
        <div class="text-sm text-slate-400">مراقبة التجار والمسوقين</div>
    </div>
    
    <div class="overflow-x-auto bg-slate-800 rounded-xl border border-slate-700 shadow-xl">
        <table class="w-full text-right text-sm">
            <thead class="bg-slate-900 text-slate-400 uppercase font-bold">
                <tr>
                    <th class="p-4">المستخدم</th>
                    <th class="p-4">الدور</th>
                    <th class="p-4">البصمة (Fraud Check)</th>
                    <th class="p-4">مستحقات المنصة</th>
                    <th class="p-4">رصيد الأرباح</th>
                    <th class="p-4">الحالة</th>
                    <th class="p-4 text-center">إجراءات</th>
                </tr>
            </thead>
            <tbody id="usersTable" class="divide-y divide-slate-700"></tbody>
        </table>
    </div>

    <div id="msgModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-blue-400">📩 رسائل المستخدم</h3>
                <button onclick="document.getElementById('msgModal').style.display='none'" class="text-red-400 hover:text-red-300">✕</button>
            </div>
            <div id="msgList" class="space-y-4"></div>
        </div>
    </div>

<script>
    // جلب المستخدمين
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        
        document.getElementById('usersTable').innerHTML = users.map(u => `
            <tr class="hover:bg-slate-700/50 transition">
                <td class="p-4">
                    <div class="font-bold text-white">${u.name}</div>
                    <div class="text-xs text-slate-400">${u.email}</div>
                </td>
                <td class="p-4">
                    <span class="px-2 py-1 rounded text-xs font-bold ${u.role==='merchant'?'bg-blue-900 text-blue-300':'bg-purple-900 text-purple-300'}">
                        ${u.role==='merchant' ? 'تاجر 📦' : 'مسوق 📢'}
                    </span>
                </td>
                <td class="p-4 font-mono text-xs text-slate-500 select-all" title="بصمة الجهاز">${u.fingerprint || 'N/A'}</td>
                <td class="p-4">
                    ${u.debt > 0 ? `<span class="text-red-400 font-bold">${u.debt} دج</span>` : '<span class="text-green-500">0</span>'}
                </td>
                <td class="p-4 text-green-400 font-bold">${u.balance} دج</td>
                <td class="p-4">
                    ${u.isBanned 
                        ? '<span class="bg-red-900 text-red-200 px-2 py-1 rounded text-xs">محظور ⛔</span>' 
                        : '<span class="bg-green-900 text-green-200 px-2 py-1 rounded text-xs">نشط ✅</span>'}
                </td>
                <td class="p-4 flex justify-center gap-2">
                    <button onclick="showMessages('${u._id}')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-xs relative">
                        رسائل 💬 <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full ${u.messages && u.messages.length > 0 ? '' : 'hidden'}"></span>
                    </button>
                    ${u.debt > 0 ? 
                        `<button onclick="clearDebt('${u._id}')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded text-xs">دفع الدين 💰</button>` : ''}
                    <button onclick="toggleBan('${u._id}', ${!u.isBanned})" class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded text-xs transition">
                        ${u.isBanned ? 'فك الحظر' : 'حظر'}
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // عرض الرسائل (إثباتات الدفع)
    async function showMessages(id) {
        // في الواقع يجب جلب المستخدم بالتفصيل، لكن هنا سنعتمد على البيانات المحملة
        // سنعيد جلب المستخدمين للتأكد
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const user = users.find(u => u._id === id);
        
        const list = document.getElementById('msgList');
        if(!user.messages || user.messages.length === 0) {
            list.innerHTML = '<p class="text-center text-slate-500">لا توجد رسائل</p>';
        } else {
            list.innerHTML = user.messages.reverse().map(m => `
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <p class="text-sm text-gray-300 mb-2">${m.text}</p>
                    ${m.image ? `<a href="${m.image}" target="_blank"><img src="${m.image}" class="w-full h-32 object-cover rounded border border-slate-600 hover:opacity-80 transition"></a>` : ''}
                    <div class="text-[10px] text-gray-500 mt-2 text-left">${new Date(m.date).toLocaleString()}</div>
                </div>
            `).join('');
        }
        document.getElementById('msgModal').style.display = 'flex';
    }

    // تصفير الدين (بعد استلام المال)
    async function clearDebt(id) {
        if(!confirm('هل تأكدت من استلام المبلغ في RedotPay؟')) return;
        
        // هنا يجب إضافة API خاص لتصفير الدين في السيرفر (أضفته لك في index.js سابقاً تحت اسم clear-debt)
        // لكن بما أنني لم أضعه في الكود الأخير، سأستخدم تحديث المستخدم مباشرة
        // ملاحظة: في الكود السابق (Pro)، لم أضف endpoint خاص اسمه clear-debt، لذا سأضيفه لك الآن في ذهنك لتضيفه في index.js
        // أو يمكنك استخدام "تحديث" عادي.
        
        // الأفضل: سأفترض أنك ستضيف هذا المسار في index.js، أو سأعطيك الكود له أدناه لتضيفه.
        
        // الحل السريع: نرسل تحديث عادي للمستخدم
        /*
        await fetch('/api/user/update', { ... }) 
        ولكن، بما أننا لم نكتب هذا الـ API، سأفترض أنك ستضيف هذا المقطع الصغير في index.js:
        
        app.post('/api/admin/cleardebt', async (req, res) => {
             const user = await User.findById(req.body.userId);
             user.debt = 0; user.debtDeadline = null; user.isBanned = false;
             await user.save();
             res.json({success: true});
        });
        */
        
        // سأستخدم المسار الذي يفترض وجوده
        await fetch('/api/admin/cleardebt', { // تأكد من إضافة هذا في index.js
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId: id })
        });
        
        alert('تم تصفير الدين وفك الحظر!');
        loadUsers();
    }

    // حظر / فك حظر
    async function toggleBan(id, status) {
        if(!confirm(status ? 'هل تريد حظر هذا المستخدم؟' : 'هل تريد فك الحظر؟')) return;
        
        // سنستخدم نفس المنطق، نفترض وجود API للحظر
        await fetch('/api/admin/ban', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId: id, status })
        });
        loadUsers();
    }

    loadUsers();
</script>
</body>
</html>
