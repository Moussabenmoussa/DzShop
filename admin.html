
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Cairo', sans-serif; background: #f3f4f6; }</style>
</head>
<body class="pb-10">

    <!-- Header -->
    <header class="bg-[#1a1a1a] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wider">DZ<span class="text-red-500">ADMIN</span></h1>
        <div class="text-xs font-mono bg-white/10 px-3 py-1 rounded-full" id="serverStatus">🟢 Server Online</div>
    </header>

    <div class="flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-white shadow-sm md:h-screen sticky top-16">
            <nav class="p-4 space-y-2">
                <button onclick="loadTab('dashboard')" class="w-full text-right px-4 py-3 rounded-lg font-bold bg-red-50 text-red-600 hover:bg-red-100 transition"><i class="fas fa-chart-pie w-6"></i> نظرة عامة</button>
                <button onclick="loadTab('disputes')" class="w-full text-right px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition relative">
                    <i class="fas fa-gavel w-6"></i> النزاعات 
                    <span class="bg-red-500 text-white text-[10px] px-2 rounded-full absolute left-4" id="disputeCount">0</span>
                </button>
                <button onclick="loadTab('chat-monitor')" class="w-full text-right px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition"><i class="fas fa-eye w-6"></i> مراقبة الشات</button>
                <button onclick="loadTab('users')" class="w-full text-right px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition"><i class="fas fa-users w-6"></i> المستخدمين</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6" id="mainContent">
            <!-- سيتم تحميل المحتوى هنا بالجافاسكربت -->
            <div class="text-center py-20"><i class="fas fa-circle-notch fa-spin text-4xl text-gray-300"></i></div>
        </main>
    </div>

    <!-- MODAL: Chat Viewer (للتجسس/المراقبة) -->
    <div id="chatModal" class="hidden fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg h-[80vh] rounded-xl flex flex-col overflow-hidden">
            <div class="bg-gray-100 p-3 border-b flex justify-between items-center">
                <h3 class="font-bold text-sm"><i class="fas fa-user-secret text-red-600 mr-2"></i>سجل المحادثة</h3>
                <button onclick="document.getElementById('chatModal').classList.add('hidden')" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div id="chatViewerBody" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#e5ddd5]">
                <!-- الرسائل ستظهر هنا -->
            </div>
        </div>
    </div>

    <script>
        // دالة بسيطة لجلب البيانات
        async function fetchAPI(endpoint, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(endpoint, opts);
            return await res.json();
        }

        async function loadTab(tab) {
            const main = document.getElementById('mainContent');
            main.innerHTML = '<div class="text-center py-20"><i class="fas fa-circle-notch fa-spin text-2xl text-gray-400"></i></div>';

            if (tab === 'dashboard') {
                const stats = await fetchAPI('/api/admin/stats'); // تأكد من وجود هذا المسار في السيرفر
                main.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-blue-500">
                            <h3 class="text-gray-400 text-xs font-bold mb-1">المستخدمين</h3>
                            <div class="text-3xl font-black">${stats.users || 0}</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-green-500">
                            <h3 class="text-gray-400 text-xs font-bold mb-1">طلبات نشطة (Escrow)</h3>
                            <div class="text-3xl font-black">${stats.activeOrders || 0}</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-red-500">
                            <h3 class="text-gray-400 text-xs font-bold mb-1">نزاعات مفتوحة</h3>
                            <div class="text-3xl font-black">${stats.disputes || 0}</div>
                        </div>
                    </div>
                `;
            }

            else if (tab === 'disputes') {
                // (ملاحظة: تحتاج لإضافة endpoint في السيرفر لجلب الطلبات المتنازع عليها، سأستخدم بيانات وهمية للمثال)
                // في السيرفر أضف: app.get('/api/admin/orders?status=disputed', ...)
                main.innerHTML = `
                    <h2 class="text-xl font-bold mb-4">النزاعات المفتوحة (Disputes)</h2>
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table class="w-full text-sm text-right">
                            <thead class="bg-gray-50 text-gray-500">
                                <tr>
                                    <th class="p-3">رقم الطلب</th>
                                    <th class="p-3">المبلغ</th>
                                    <th class="p-3">السبب</th>
                                    <th class="p-3">الإجراء</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <tr>
                                    <td class="p-3 font-mono">#ORD-9921</td>
                                    <td class="p-3 font-bold text-red-500">150 $</td>
                                    <td class="p-3">المشتري يدعي أن الحساب لا يعمل</td>
                                    <td class="p-3 flex gap-2">
                                        <button onclick="openChatViewer('CHAT_ID_HERE')" class="bg-gray-100 text-gray-600 px-3 py-1 rounded font-bold text-xs hover:bg-gray-200"><i class="fas fa-eye"></i> مراقبة الشات</button>
                                        <button onclick="resolveDispute('ORDER_ID', 'release_seller')" class="bg-green-100 text-green-700 px-3 py-1 rounded font-bold text-xs hover:bg-green-200">تحرير للبائع</button>
                                        <button onclick="resolveDispute('ORDER_ID', 'refund_buyer')" class="bg-red-100 text-red-700 px-3 py-1 rounded font-bold text-xs hover:bg-red-200">إرجاع للمشتري</button>
                                    </td>
                                </tr>
                                <!-- المزيد من الصفوف -->
                            </tbody>
                        </table>
                    </div>
                `;
            }

            else if (tab === 'chat-monitor') {
                main.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">مراقبة المحادثات الحية</h2>
                        <input type="text" placeholder="بحث باسم المستخدم..." class="bg-white border px-4 py-2 rounded-lg text-sm">
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-4 text-center text-gray-400 text-sm">
                        هنا تظهر قائمة آخر المحادثات (يحتاج ربط بالسيرفر)
                    </div>
                `;
            }
        }

        // منطق مراقبة الشات
        async function openChatViewer(chatId) {
            document.getElementById('chatModal').classList.remove('hidden');
            const body = document.getElementById('chatViewerBody');
            body.innerHTML = '<div class="text-center mt-10"><i class="fas fa-spinner fa-spin"></i> جاري تحميل السجل...</div>';
            
            // جلب الرسائل من السيرفر (باستخدام API الأدمن)
            try {
                const msgs = await fetchAPI(`/api/admin/chat-monitor/${chatId}`); // تأكد من وجود هذا المسار
                body.innerHTML = msgs.map(m => {
                    const typeStyle = m.type === 'invoice' ? 'bg-yellow-100 border-yellow-300 border text-yellow-800' : 'bg-white';
                    return `
                        <div class="flex flex-col mb-2 ${m.senderId === 'system' ? 'items-center' : 'items-start'}">
                            <span class="text-[9px] text-gray-500 mb-0.5">${m.senderId === 'system' ? 'النظام' : m.senderId}</span>
                            <div class="max-w-[80%] p-2 rounded-lg text-sm shadow-sm ${typeStyle}">
                                ${m.type === 'invoice' ? `💰 فاتورة بقيمة ${m.meta.amount}$` : m.content}
                            </div>
                            <span class="text-[8px] text-gray-400 mt-0.5">${new Date(m.date).toLocaleTimeString()}</span>
                        </div>
                    `;
                }).join('');
            } catch(e) { body.innerHTML = '<p class="text-red-500 text-center">خطأ في التحميل</p>'; }
        }

        async function resolveDispute(orderId, decision) {
            if(!confirm('هل أنت متأكد من هذا الحكم النهائي؟ لا يمكن التراجع عنه.')) return;
            await fetchAPI('/api/admin/resolve-dispute', 'POST', { orderId, decision });
            alert('تم تنفيذ الحكم');
            loadTab('disputes');
        }

        // Load Dashboard on start
        loadTab('dashboard');
    </script>
</body>
</html>
