1<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzAffiliate - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        /* إخفاء كل الشاشات افتراضياً لمنع الوميض */
        .view-section { display: none; }
        .active-view { display: flex; }
    </style>
</head>
<body>

    <div id="authView" class="view-section min-h-screen items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <h1 class="text-3xl font-black text-center text-blue-600 mb-2">DzAffiliate</h1>
            <p class="text-center text-slate-400 text-sm mb-6">منصة التجارة بالعمولة</p>
            
            <div id="loginForm" class="space-y-4">
                <input id="lEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3 bg-slate-50 border rounded-xl">
                <input id="lPass" type="password" placeholder="كلمة المرور" class="w-full p-3 bg-slate-50 border rounded-xl">
                <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">دخول</button>
                <p class="text-center text-xs text-gray-500 cursor-pointer" onclick="toggleForms('register')">ليس لديك حساب؟ سجل الآن</p>
            </div>

            <div id="registerForm" class="space-y-4 hidden">
                <input id="rName" type="text" placeholder="الاسم الكامل" class="w-full p-3 bg-slate-50 border rounded-xl">
                <input id="rEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3 bg-slate-50 border rounded-xl">
                <input id="rPass" type="password" placeholder="كلمة المرور" class="w-full p-3 bg-slate-50 border rounded-xl">
                <input id="rCcp" type="text" placeholder="رقم CCP / BaridiMob" class="w-full p-3 bg-slate-50 border rounded-xl">
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer"><input type="radio" name="role" value="affiliate" checked class="mr-2"> مسوق</label>
                    <label class="flex-1 cursor-pointer"><input type="radio" name="role" value="merchant" class="mr-2"> تاجر</label>
                </div>
                <button onclick="register()" id="regBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700">إنشاء حساب</button>
                <p class="text-center text-xs text-gray-500 cursor-pointer" onclick="toggleForms('login')">لديك حساب؟ سجل الدخول</p>
            </div>
        </div>
    </div>

    <div id="dashView" class="view-section min-h-screen flex-col md:flex-row">
        
        <aside class="bg-white w-full md:w-64 border-l p-6 flex flex-col justify-between shadow-sm z-10">
            <div>
                <div class="font-black text-xl text-blue-600 mb-2">DzAffiliate</div>
                <div class="text-xs bg-slate-100 inline-block px-2 py-1 rounded text-slate-500 mb-6" id="userRoleBadge">...</div>
                
                <div class="space-y-4">
                    <div class="bg-slate-50 p-4 rounded-xl border">
                        <div class="text-xs text-slate-400">الرصيد الحالي</div>
                        <div class="text-2xl font-black text-green-600"><span id="userBalance">0</span> د.ج</div>
                    </div>
                </div>
            </div>
            <button onclick="logout()" class="text-red-500 text-sm font-bold flex items-center gap-2 mt-10"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto">
            
            <div id="affiliateContent" class="hidden space-y-6">
                <h2 class="text-2xl font-bold text-slate-800">سوق العروض 🛒</h2>
                <div id="marketGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">Loading...</div>
            </div>

            <div id="merchantContent" class="hidden space-y-8">
                
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <h3 class="font-bold mb-4 text-lg">📦 إضافة منتج جديد</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input id="mProdTitle" placeholder="اسم المنتج" class="w-full p-3 bg-slate-50 border rounded-lg">
                        <input id="mProdImg" placeholder="رابط الصورة (URL)" class="w-full p-3 bg-slate-50 border rounded-lg text-left ltr">
                        <input id="mProdPrice" type="number" placeholder="سعر البيع (د.ج)" class="w-full p-3 bg-slate-50 border rounded-lg">
                        <input id="mProdComm" type="number" placeholder="عمولة المسوق (د.ج)" class="w-full p-3 bg-slate-50 border border-green-200 rounded-lg">
                    </div>
                    <button onclick="publishProduct()" id="pubBtn" class="bg-slate-900 hover:bg-slate-800 text-white px-8 py-3 rounded-xl mt-4 text-sm font-bold transition">
                        نشر المنتج في السوق 🚀
                    </button>
                </div>

                <div>
                    <h3 class="font-bold text-lg mb-4">منتجاتي المعروضة</h3>
                    <div id="myProductsList" class="grid grid-cols-1 gap-4"></div>
                </div>

                <div>
                    <h3 class="font-bold text-lg mb-4">الطلبات الواردة</h3>
                    <div class="bg-white rounded-xl border overflow-hidden">
                        <table class="w-full text-sm text-right">
                            <thead class="bg-slate-50 text-slate-500">
                                <tr>
                                    <th class="p-4">المنتج</th>
                                    <th class="p-4">الزبون</th>
                                    <th class="p-4">الهاتف</th>
                                    <th class="p-4">الحالة</th>
                                    <th class="p-4 text-center">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTable"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>

<script>
    let USER = null;

    // === 1. النظام الذكي للجلسة (Auto Login) ===
    window.onload = async function() {
        const savedUser = localStorage.getItem('dz_user');
        
        if (savedUser) {
            // لدينا مستخدم محفوظ، نتحقق من صحته من السيرفر
            try {
                const parsedUser = JSON.parse(savedUser);
                const res = await fetch('/api/user/refresh', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: parsedUser._id })
                });
                const freshUser = await res.json();
                
                if (freshUser) {
                    USER = freshUser;
                    localStorage.setItem('dz_user', JSON.stringify(USER));
                    showDashboard(); // فتح اللوحة مباشرة
                } else {
                    showAuth(); // المستخدم غير موجود (محذوف)، نعود للدخول
                }
            } catch (e) { showAuth(); }
        } else {
            showAuth(); // لا يوجد مستخدم محفوظ
        }
    };

    function showAuth() {
        document.getElementById('authView').classList.add('active-view');
        document.getElementById('dashView').classList.remove('active-view');
    }

    function showDashboard() {
        document.getElementById('authView').classList.remove('active-view');
        document.getElementById('dashView').classList.add('active-view');
        
        // تحديث واجهة المستخدم
        document.getElementById('userRoleBadge').innerText = USER.role === 'merchant' ? 'تاجر' : 'مسوق';
        document.getElementById('userBalance').innerText = USER.balance;

        if (USER.role === 'merchant') {
            document.getElementById('merchantContent').classList.remove('hidden');
            loadMerchantData();
        } else {
            document.getElementById('affiliateContent').classList.remove('hidden');
            loadMarketplace();
        }
    }

    function toggleForms(form) {
        document.getElementById('loginForm').classList.toggle('hidden', form !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', form !== 'register');
    }

    // === 2. المصادقة ===
    async function login() {
        const email = document.getElementById('lEmail').value;
        const password = document.getElementById('lPass').value;
        const btn = document.getElementById('loginBtn');
        btn.innerText = 'جاري الدخول...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const d = await res.json();
            
            if (d.success) {
                USER = d.user;
                localStorage.setItem('dz_user', JSON.stringify(USER));
                location.reload(); // تحديث الصفحة لتفعيل Auto Login
            } else {
                alert(d.msg);
                btn.innerText = 'دخول';
            }
        } catch(e) { alert('خطأ في الاتصال'); btn.innerText = 'دخول'; }
    }

    async function register() {
        const role = document.querySelector('input[name="role"]:checked').value;
        const data = {
            name: document.getElementById('rName').value,
            email: document.getElementById('rEmail').value,
            password: document.getElementById('rPass').value,
            ccp: document.getElementById('rCcp').value,
            role: role
        };

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const d = await res.json();
        
        if (d.success) {
            USER = d.user;
            localStorage.setItem('dz_user', JSON.stringify(USER));
            location.reload();
        } else {
            alert(d.msg);
        }
    }

    function logout() {
        localStorage.removeItem('dz_user');
        location.reload();
    }

    // === 3. وظائف التاجر (Merchant) ===
    async function publishProduct() {
        const btn = document.getElementById('pubBtn');
        const title = document.getElementById('mProdTitle').value;
        const image = document.getElementById('mProdImg').value;
        const price = document.getElementById('mProdPrice').value;
        const commission = document.getElementById('mProdComm').value;

        if(!title || !price || !commission) return alert('يرجى ملء جميع الحقول');

        btn.innerText = 'جاري النشر...';
        btn.disabled = true;

        const data = {
            merchantId: USER._id,
            title, image, price, commission
        };

        await fetch('/api/merchant/product', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        alert('✅ تم نشر المنتج بنجاح!');
        location.reload(); // تحديث لإظهار المنتج الجديد
    }

    async function loadMerchantData() {
        // جلب المنتجات
        const pRes = await fetch('/api/merchant/my-products', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ merchantId: USER._id })
        });
        const products = await pRes.json();
        document.getElementById('myProductsList').innerHTML = products.map(p => `
            <div class="bg-slate-50 p-3 rounded border flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="${p.image || 'https://via.placeholder.com/50'}" class="w-10 h-10 rounded object-cover">
                    <span class="font-bold">${p.title}</span>
                </div>
                <div class="text-sm text-green-600 font-bold">${p.price} دج</div>
            </div>
        `).join('');

        // جلب الطلبات
        const oRes = await fetch('/api/merchant/orders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ merchantId: USER._id })
        });
        const orders = await oRes.json();
        document.getElementById('ordersTable').innerHTML = orders.map(o => `
            <tr class="border-b hover:bg-slate-50">
                <td class="p-4 font-bold">${o.productName}</td>
                <td class="p-4">${o.customerName}</td>
                <td class="p-4 text-blue-600 font-mono">${o.customerPhone}</td>
                <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold ${o.status === 'delivered' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${o.status === 'pending' ? 'قيد الانتظار' : 'تم التوصيل'}</span></td>
                <td class="p-4 text-center">
                    ${o.status !== 'delivered' ? 
                    `<button onclick="confirmDelivery('${o._id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700">تأكيد التوصيل ✅</button>` : 
                    '<i class="fas fa-check-circle text-green-500 text-xl"></i>'}
                </td>
            </tr>
        `).join('');
    }

    async function confirmDelivery(orderId) {
        if(!confirm('هل استلم الزبون الطلب؟ (سيتم خصم العمولة للمسوق)')) return;
        
        await fetch('/api/order/status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ orderId, status: 'delivered' })
        });
        loadMerchantData(); // تحديث الجدول
    }

    // === 4. وظائف المسوق (Affiliate) ===
    async function loadMarketplace() {
        const res = await fetch('/api/market/products');
        const products = await res.json();
        
        if(products.length === 0) {
            document.getElementById('marketGrid').innerHTML = '<p class="text-center col-span-3 text-slate-400">لا توجد عروض حالياً</p>';
            return;
        }

        document.getElementById('marketGrid').innerHTML = products.map(p => `
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition">
                <img src="${p.image || 'https://via.placeholder.com/400'}" class="w-full h-48 object-cover bg-gray-100">
                <div class="p-4">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-slate-800">${p.title}</h3>
                        <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded font-bold">+${p.commission} دج</span>
                    </div>
                    <p class="text-slate-500 text-sm mb-4">سعر البيع: ${p.price} دج</p>
                    <button onclick="copyLink('${p._id}')" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 active:scale-95 transition">
                        نسخ رابطي 🔗
                    </button>
                </div>
            </div>
        `).join('');
    }

    function copyLink(id) {
        const link = `${window.location.origin}/p/${id}?ref=${USER._id}`;
        navigator.clipboard.writeText(link).then(() => {
            alert('تم نسخ الرابط بنجاح! ✅\n\n' + link);
        });
    }
</script>
</body>
</html>
