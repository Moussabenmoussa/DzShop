<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DzMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f5f5f5; padding-bottom: 70px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN (نفس الكود السابق، تأكد من وجوده) -->
    <!-- ... (Login/Register Forms) ... -->
    <!-- لتوفير المساحة هنا، سأركز على التغيير في الـ Nav -->

    <!-- MAIN APP -->
    <div id="mainApp" class=""> <!-- افترضنا الدخول تم -->
        
        <!-- Header -->
        <div class="fixed top-0 w-full bg-white h-14 border-b flex items-center justify-between px-4 z-40">
            <div class="font-black text-xl text-red-600">DZ</div>
            <div class="text-xs font-bold" id="headerBal">0.00 $</div>
        </div>

        <!-- Content -->
        <div class="pt-16 px-2">
            <!-- MARKET View -->
            <div id="page-market">
                <button onclick="window.location.href='/add'" class="w-full bg-black text-white py-3 rounded-xl mb-4 font-bold shadow-lg">+ إضافة خدمة</button>
                <div id="marketGrid" class="grid grid-cols-2 gap-2"></div>
            </div>
            
            <!-- (تم حذف صفحة الشات من هنا) -->
        </div>

        <!-- Bottom Nav (المعدل) -->
        <div class="fixed bottom-0 w-full bg-white h-16 border-t flex justify-around items-center z-40">
            <button onclick="nav('market')" class="flex flex-col items-center text-red-600">
                <i class="fas fa-home text-xl"></i><span class="text-[10px]">السوق</span>
            </button>
            
            <!-- زر الشات الجديد: يفتح صفحة مستقلة -->
            <button onclick="window.location.href='/chat'" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-comments text-xl"></i><span class="text-[10px]">الرسائل</span>
            </button>
            
            <button onclick="window.location.href='/profile/me'" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-user text-xl"></i><span class="text-[10px]">حسابي</span>
            </button>
        </div>

    </div>

    <script>
        // ... (كود الجلب للسوق فقط) ...
        async function loadMarket() {
            const res = await fetch('/api/market');
            const data = await res.json();
            document.getElementById('marketGrid').innerHTML = data.map(i => `
                <div class="product-card" onclick="window.location.href='/p/${i._id}'">
                    <img src="${i.image || 'https://via.placeholder.com/200'}" class="product-img">
                    <div class="p-2">
                        <div class="font-bold text-sm truncate">${i.title}</div>
                        <div class="text-red-600 font-black">${i.price} $</div>
                    </div>
                </div>
            `).join('');
        }
        
        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if(u) {
                document.getElementById('headerBal').innerText = JSON.parse(u).balance + ' $';
                loadMarket();
            } else {
                // Show Login Form logic
            }
        }
    </script>
</body>
</html>
