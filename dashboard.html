<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DzMarket | السوق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brand: #fb2e2e; --bg: #f2f2f2; }
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #333; padding-bottom: 70px; }
        
        /* تصميم البطاقة الاحترافي (Temu Style) */
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.98); }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--brand); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 1. AUTH SCREEN -->
    <div id="authOverlay" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl font-black text-[#fb2e2e] mb-2">DZ</h1>
        <p class="text-gray-400 text-sm mb-8">سوق الخدمات الرقمية</p>
        
        <div id="loginForm" class="w-full max-w-sm space-y-3">
            <input id="lEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 rounded-xl font-bold outline-none">
            <input id="lPass" type="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 rounded-xl font-bold outline-none">
            <button onclick="login()" class="w-full bg-[#fb2e2e] text-white py-4 rounded-xl font-black shadow-lg">دخول</button>
            <p class="text-center text-sm mt-4" onclick="toggleAuth()">ليس لديك حساب؟ <span class="text-red-500 font-bold">سجل الآن</span></p>
        </div>

        <div id="regForm" class="w-full max-w-sm space-y-3 hidden">
            <input id="rName" type="text" placeholder="الاسم" class="w-full p-4 bg-gray-50 rounded-xl font-bold">
            <input id="rEmail" type="email" placeholder="البريد" class="w-full p-4 bg-gray-50 rounded-xl font-bold">
            <input id="rPass" type="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 rounded-xl font-bold">
            <button onclick="register()" class="w-full bg-[#fb2e2e] text-white py-4 rounded-xl font-black shadow-lg">تسجيل</button>
            <p class="text-center text-sm mt-4" onclick="toggleAuth()">لديك حساب؟ دخول</p>
        </div>
    </div>

    <!-- 2. MAIN APP -->
    <div id="appContainer" class="hidden">
        <!-- Header -->
        <header class="fixed top-0 w-full bg-white z-40 border-b h-14 flex items-center justify-between px-4 shadow-sm">
            <div class="font-black text-xl text-[#fb2e2e]">DZ</div>
            <div class="flex items-center gap-2">
                <span id="userName" class="text-xs font-bold">...</span>
                <button onclick="logout()" class="text-gray-400"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <!-- Market Grid -->
        <main class="pt-16 px-2">
            <!-- زر الإضافة -->
            <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="w-full mb-4 bg-black text-white py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-plus-circle"></i> إضافة خدمة / حساب للبيع
            </button>

            <div id="marketGrid" class="grid grid-cols-2 gap-2 pb-20">
                <div class="loader mx-auto col-span-full"></div>
            </div>
        </main>

        <!-- Bottom Nav -->
        <nav class="fixed bottom-0 w-full bg-white border-t h-16 flex justify-around items-center z-30">
            <button class="flex flex-col items-center text-[#fb2e2e]"><i class="fas fa-home text-lg"></i><span class="text-[9px] font-bold">السوق</span></button>
            <button class="flex flex-col items-center text-gray-400"><i class="fas fa-comments text-lg"></i><span class="text-[9px] font-bold">شات</span></button>
            <button class="flex flex-col items-center text-gray-400"><i class="fas fa-user text-lg"></i><span class="text-[9px] font-bold">حسابي</span></button>
        </nav>
    </div>

    <!-- 3. ADD MODAL (With Image Upload) -->
    <div id="addModal" class="hidden fixed inset-0 z-[60] bg-white flex flex-col">
        <div class="h-14 border-b flex px-4 justify-between items-center bg-gray-50">
            <h3 class="font-bold">نشر خدمة جديدة</h3>
            <button onclick="document.getElementById('addModal').classList.add('hidden')" class="w-8 h-8 bg-gray-200 rounded-full"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-5 space-y-4 overflow-y-auto">
            <!-- رفع الصورة -->
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer bg-gray-50" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-camera text-2xl text-gray-400 mb-2"></i>
                <p class="text-xs text-gray-500 font-bold">اضغط لإضافة صورة (إجباري)</p>
                <img id="previewImg" class="hidden w-full h-32 object-cover rounded-lg mt-2 mx-auto">
                <div id="uploadLoader" class="hidden text-xs text-blue-500 mt-2 font-bold">جاري الرفع...</div>
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage()">
            <input type="hidden" id="pImgUrl">

            <input id="pTitle" type="text" placeholder="عنوان الخدمة (مثال: حساب أدسنس 2023)" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-sm">
            <textarea id="pDesc" rows="4" placeholder="وصف التفاصيل..." class="w-full p-4 bg-gray-50 rounded-xl font-bold text-sm"></textarea>
            <input id="pPrice" type="number" placeholder="السعر ($)" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-sm">
            
            <button onclick="publishListing()" id="pubBtn" class="w-full bg-[#fb2e2e] text-white py-4 rounded-xl font-black shadow-lg opacity-50" disabled>نشر الخدمة</button>
        </div>
    </div>

    <script>
        // CONFIG
        const CLOUD_NAME = 'dvtuocsxs'; 
        const UPLOAD_PRESET = 'DZmarket';
        let USER = null;

        // AUTH Logic
        function toggleAuth() { document.getElementById('loginForm').classList.toggle('hidden'); document.getElementById('regForm').classList.toggle('hidden'); }
        
        async function login() {
            const email = document.getElementById('lEmail').value;
            const password = document.getElementById('lPass').value;
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password }) });
                const d = await res.json();
                if(d.success) initApp(d.user); else alert(d.msg);
            } catch(e) { alert('خطأ في الاتصال'); }
        }

        async function register() {
            const name = document.getElementById('rName').value;
            const email = document.getElementById('rEmail').value;
            const password = document.getElementById('rPass').value;
            try {
                const res = await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, email, password }) });
                const d = await res.json();
                if(d.success) initApp(d.user); else alert('خطأ في التسجيل');
            } catch(e) { alert('خطأ'); }
        }

        function initApp(user) {
            USER = user;
            localStorage.setItem('dz_user', JSON.stringify(user));
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            loadMarket();
        }

        function logout() { localStorage.removeItem('dz_user'); location.reload(); }

        // IMAGE UPLOAD (Cloudinary)
        async function uploadImage() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;
            
            document.getElementById('uploadLoader').classList.remove('hidden');
            const fd = new FormData();
            fd.append('file', file);
            fd.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
                const data = await res.json();
                
                if(data.secure_url) {
                    document.getElementById('pImgUrl').value = data.secure_url;
                    document.getElementById('previewImg').src = data.secure_url;
                    document.getElementById('previewImg').classList.remove('hidden');
                    // تفعيل زر النشر
                    document.getElementById('pubBtn').disabled = false;
                    document.getElementById('pubBtn').classList.remove('opacity-50');
                }
            } catch(e) { alert('فشل رفع الصورة'); }
            document.getElementById('uploadLoader').classList.add('hidden');
        }

        // MARKET LOGIC
        async function publishListing() {
            const data = {
                userId: USER._id,
                title: document.getElementById('pTitle').value,
                desc: document.getElementById('pDesc').value,
                price: Number(document.getElementById('pPrice').value),
                image: document.getElementById('pImgUrl').value
            };
            
            if(!data.title || !data.price || !data.image) return alert('جميع الحقول والصورة مطلوبة');

            await fetch('/api/listing/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            document.getElementById('addModal').classList.add('hidden');
            loadMarket();
        }

        async function loadMarket() {
            try {
                const res = await fetch('/api/market');
                const items = await res.json();
                const grid = document.getElementById('marketGrid');
                
                if(items.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">لا توجد خدمات بعد</div>';
                    return;
                }

                grid.innerHTML = items.map(i => `
                    <div class="product-card" onclick="window.location.href='/p/${i._id}'">
                        <img src="${i.image || 'https://via.placeholder.com/300'}" class="product-img">
                        <div class="p-2">
                            <h3 class="text-xs font-bold truncate mb-1">${i.title}</h3>
                            <div class="flex justify-between items-center">
                                <span class="font-black text-[#fb2e2e]">${i.price} $</span>
                                <span class="text-[9px] text-gray-400">${new Date(i.date).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // Auto Login
        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if(u) initApp(JSON.parse(u));
        };
    </script>
</body>
</html>
