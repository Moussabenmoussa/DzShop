<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إضافة خدمة | DzMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f5f5f5; }
        .input-field { font-size: 16px !important; }
    </style>
</head>
<body class="pb-6">

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-4 right-4 left-4 z-50 p-4 rounded-xl shadow-lg"></div>

    <!-- Header -->
    <div class="fixed top-0 w-full bg-white h-14 border-b flex items-center px-4 justify-between z-40 shadow-sm">
        <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100"><i class="fas fa-arrow-right text-gray-600"></i></button>
        <span class="font-bold">إضافة خدمة جديدة</span>
        <div class="w-10"></div>
    </div>

    <!-- Form -->
    <div class="pt-20 px-4 max-w-lg mx-auto">

        <!-- Image Upload -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">صورة الخدمة</label>
            <div id="imagePreview" class="w-full h-48 bg-gray-100 rounded-2xl border-2 border-dashed border-gray-300 flex items-center justify-center cursor-pointer hover:border-purple-400 transition overflow-hidden" onclick="document.getElementById('imageInput').click()">
                <div class="text-center text-gray-400" id="uploadPlaceholder">
                    <i class="fas fa-cloud-upload-alt text-4xl mb-2"></i>
                    <p class="text-sm">اضغط لرفع صورة</p>
                </div>
            </div>
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(this)">
        </div>

        <!-- Title -->
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">عنوان الخدمة *</label>
            <input type="text" id="title" class="input-field w-full bg-white rounded-xl px-4 py-3 border border-gray-200 focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none" placeholder="مثال: تصميم شعار احترافي">
        </div>

        <!-- Description -->
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">الوصف</label>
            <textarea id="desc" rows="4" class="input-field w-full bg-white rounded-xl px-4 py-3 border border-gray-200 focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none resize-none" placeholder="اكتب وصفاً تفصيلياً للخدمة..."></textarea>
        </div>

        <!-- Price -->
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">السعر ($) *</label>
            <div class="relative">
                <input type="number" id="price" min="1" class="input-field w-full bg-white rounded-xl px-4 py-3 border border-gray-200 focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none" placeholder="0.00">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
            </div>
        </div>

        <!-- Category -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">التصنيف</label>
            <select id="category" class="input-field w-full bg-white rounded-xl px-4 py-3 border border-gray-200 focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none">
                <option value="">اختر تصنيفاً</option>
                <option value="accounts">حسابات</option>
                <option value="services">خدمات</option>
                <option value="designs">تصميم</option>
                <option value="programming">برمجة</option>
            </select>
        </div>

        <!-- Info Box -->
        <div class="bg-purple-50 border border-purple-200 rounded-xl p-4 mb-6">
            <div class="flex items-start gap-3">
                <i class="fas fa-shield-alt text-purple-600 mt-1"></i>
                <div>
                    <h4 class="font-bold text-purple-800 text-sm">نظام Escrow الآمن</h4>
                    <p class="text-purple-600 text-xs mt-1">عند بيع خدمتك، سيتم حجز المبلغ حتى تأكيد المشتري للاستلام. عمولة المنصة 5%.</p>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button onclick="submitListing()" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
            <i class="fas fa-plus"></i>
            <span>نشر الخدمة</span>
        </button>

    </div>

    <script>
        let USER = null;
        let imageBase64 = '';

        window.onload = () => {
            const u = localStorage.getItem('dz_user');
            if (!u) return window.location.href = '/';
            USER = JSON.parse(u);
        };

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.className = `fixed top-4 right-4 left-4 z-50 p-4 rounded-xl shadow-lg ${type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
            toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'} mr-2"></i>${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageBase64 = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${imageBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function submitListing() {
            const title = document.getElementById('title').value.trim();
            const desc = document.getElementById('desc').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const category = document.getElementById('category').value;

            if (!title) return showToast('يرجى إدخال عنوان الخدمة');
            if (!price || price <= 0) return showToast('يرجى إدخال سعر صحيح');

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';

            try {
                const res = await fetch('/api/listing/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: USER._id,
                        title, desc, price, category,
                        image: imageBase64
                    })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('تم نشر الخدمة بنجاح!', 'success');
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    showToast(data.msg || 'حدث خطأ');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-plus"></i><span>نشر الخدمة</span>';
                }
            } catch (e) {
                showToast('خطأ في الاتصال');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus"></i><span>نشر الخدمة</span>';
            }
        }
    </script>
</body>
</html>
