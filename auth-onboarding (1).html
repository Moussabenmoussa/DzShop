<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzMarket SaaS - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e63946;
            --secondary: #1d3557;
            --success: #22c55e;
            --bg: #f8f9fa;
            --text: #212529;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .branding {
                display: none;
            }
        }

        .branding {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .branding h1 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .branding p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .branding .features {
            margin-top: 40px;
            text-align: right;
            font-size: 14px;
            line-height: 2;
        }

        .form-section {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #c1121f);
            color: white;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(230, 57, 70, 0.3);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .toggle-auth a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #dcfce7;
            color: #16a34a;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }

        .alert {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .plan-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .plan-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(230, 57, 70, 0.1);
        }

        .plan-card.selected {
            border-color: var(--primary);
            background: rgba(230, 57, 70, 0.05);
        }

        .plan-card h4 {
            margin-bottom: 10px;
            color: var(--text);
        }

        .plan-card p {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .plan-price {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Branding Section -->
    <div class="branding">
        <h1>🏪 DzMarket</h1>
        <p>منصة التجارة الإلكترونية الاحترافية</p>
        <div class="features">
            <p>✓ متاجر متعددة</p>
            <p>✓ إدارة سهلة</p>
            <p>✓ مبيعات فورية</p>
            <p>✓ تقارير متقدمة</p>
            <p>✓ دومين مخصص</p>
            <p>✓ دعم 24/7</p>
        </div>
    </div>

    <!-- Form Section -->
    <div class="form-section">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل دخول</button>
            <button class="tab-btn" onclick="switchTab('register')">إنشاء متجر</button>
        </div>

        <div id="message" class="message"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <!-- Login Tab -->
        <div id="login-tab" class="tab-content active">
            <h2>مرحباً بعودتك 👋</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">دخول</button>
            </form>
        </div>

        <!-- Register Tab -->
        <div id="register-tab" class="tab-content">
            <h2>أنشئ متجرك الآن ✨</h2>
            <div class="alert">
                🎉 احصل على نسخة تجريبية مجانية لمدة 14 يوم بدون بطاقة ائتمان!
            </div>
            <form onsubmit="handleRegister(event)">
                <div class="grid-2">
                    <div class="form-group">
                        <label>اسم المتجر</label>
                        <input type="text" id="storeName" required placeholder="متجري">
                    </div>
                    <div class="form-group">
                        <label>معرّف المتجر (URL)</label>
                        <input type="text" id="storeSlug" required placeholder="my-store">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>اسمك</label>
                        <input type="text" id="ownerName" required placeholder="أحمد محمد">
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="ownerEmail" required placeholder="your@email.com">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="ownerPassword" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" id="ownerPasswordConfirm" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">إنشاء المتجر</button>
            </form>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api';
    const TOKEN_KEY = 'dzmarket_token';
    const STORE_KEY = 'dzmarket_store';

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`${tab}-tab`).classList.add('active');
        event.target.classList.add('active');
    }

    function showMessage(message, type) {
        const msgEl = document.getElementById('message');
        msgEl.textContent = message;
        msgEl.className = `message ${type}`;
        setTimeout(() => msgEl.className = 'message', 5000);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        showLoading(true);
        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.setItem(STORE_KEY, JSON.stringify(data.store));
                showMessage('✓ تم تسجيل الدخول بنجاح', 'success');
                setTimeout(() => window.location.href = `/dashboard/${data.store.slug}`, 1500);
            } else {
                showMessage(data.message || 'خطأ في تسجيل الدخول', 'error');
            }
        } catch (e) {
            showMessage('خطأ في الاتصال بالخادم', 'error');
        }
        showLoading(false);
    }

    async function handleRegister(e) {
        e.preventDefault();
        const storeName = document.getElementById('storeName').value;
        const storeSlug = document.getElementById('storeSlug').value;
        const ownerName = document.getElementById('ownerName').value;
        const ownerEmail = document.getElementById('ownerEmail').value;
        const ownerPassword = document.getElementById('ownerPassword').value;
        const ownerPasswordConfirm = document.getElementById('ownerPasswordConfirm').value;

        if (ownerPassword !== ownerPasswordConfirm) {
            showMessage('كلمات المرور غير متطابقة', 'error');
            return;
        }

        showLoading(true);
        try {
            const res = await fetch(`${API_BASE}/auth/register-store`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    storeName,
                    storeSlug,
                    ownerName,
                    ownerEmail,
                    ownerPassword
                })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.setItem(STORE_KEY, JSON.stringify(data.store));
                showMessage('🎉 تم إنشاء متجرك بنجاح! جارٍ التحويل...', 'success');
                setTimeout(() => window.location.href = `/dashboard/${data.store.slug}`, 1500);
            } else {
                showMessage(data.message || 'خطأ في إنشاء المتجر', 'error');
            }
        } catch (e) {
            showMessage('خطأ في الاتصال بالخادم', 'error');
        }
        showLoading(false);
    }

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
</script>

</body>
</html>
