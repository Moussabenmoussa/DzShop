
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VidShop Pro - Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* === Styles === */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; height: 100vh; overflow: hidden; color: white; }
        .desktop-layout { display: flex; height: 100vh; width: 100vw; }
        .control-panel { width: 400px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; z-index: 50; overflow-y: auto; }
        .preview-section { flex: 1; display: flex; align-items: center; justify-content: center; background: #0f172a radial-gradient(#334155 1px, transparent 1px) 0 0 / 20px 20px; }
        .mobile-screen { width: 375px; height: 95%; max-height: 800px; background: #000; border-radius: 30px; border: 8px solid #334155; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Input Fields */
        .input-field { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; color: white; font-size: 13px; margin-bottom: 10px; }
        .input-field:focus { border-color: #3b82f6; outline: none; }
        
        /* Buttons */
        .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; }
        .btn-success { background: linear-gradient(135deg, #06b6d4, #10b981); color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn:active { transform: scale(0.98); }

        /* Mobile View Elements */
        .reel-item { height: 100%; width: 100%; position: relative; background: #000; }
        .reel-video { width: 100%; height: 100%; object-fit: cover; }
        .reel-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); pointer-events: none; }
        .reel-content * { pointer-events: auto; }
        .store-logo { position: absolute; top: 20px; right: 15px; z-index: 10; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .reels-feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reels-feed > div { scroll-snap-align: start; height: 100%; }
        .reels-feed::-webkit-scrollbar { display: none; }

        /* Fullscreen Mode (للزبون) */
        body.fullscreen-mode .control-panel { display: none !important; }
        body.fullscreen-mode .preview-section { width: 100vw; height: 100vh; padding: 0; background: #000; }
        body.fullscreen-mode .mobile-screen { width: 100%; height: 100%; border: none; border-radius: 0; }
    </style>
</head>
<body>

<div class="desktop-layout">
    <div id="control-panel" class="control-panel">
        <div class="p-4 bg-slate-900 sticky top-0 z-20 border-b border-slate-700">
            <h1 class="text-lg font-black text-white mb-3">VidShop Pro <span class="text-xs text-gray-400">Builder</span></h1>
            
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 mb-2">
                <label class="text-[10px] text-gray-400 block mb-1">رابط المتجر (Slug)</label>
                <div class="flex gap-2">
                    <input type="text" id="storeSlug" class="bg-slate-900 border border-slate-600 text-white text-xs px-2 py-2 rounded flex-1 outline-none ltr text-left" placeholder="مثال: shop-1">
                    <button onclick="publishStoreOnline()" id="pubBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold transition">
                        نشر 🌍
                    </button>
                </div>
            </div>
            
            <button onclick="downloadStore()" class="btn btn-success text-xs">
                <i class="fas fa-download"></i> تحميل كود HTML
            </button>
        </div>

        <div class="p-4 space-y-4 pb-20">
            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <h3 class="text-xs font-bold text-gray-400 mb-2">الإعدادات</h3>
                <input type="text" id="storeName" class="input-field" placeholder="اسم المتجر" value="متجر الهدايا" oninput="updatePreview()">
                <input type="number" id="shippingPrice" class="input-field" placeholder="سعر التوصيل" value="400">
                <input type="tel" id="whatsappNumber" class="input-field ltr text-left" placeholder="رقم الواتساب (213...)" value="213555123456">
                <input type="text" id="currency" class="input-field" placeholder="العملة" value="د.ج" oninput="updatePreview()">
            </div>

            <div class="bg-indigo-900/20 p-3 rounded-xl border border-indigo-500/30">
                <h3 class="text-xs font-bold text-indigo-400 mb-2">إضافة منتج جديد</h3>
                <input type="text" id="pName" class="input-field" placeholder="اسم المنتج">
                <div class="flex gap-2">
                    <input type="number" id="pPrice" class="input-field" placeholder="السعر">
                    <input type="number" id="pOld" class="input-field" placeholder="السعر القديم">
                </div>
                <input type="url" id="pVideo" class="input-field ltr text-left" placeholder="رابط الفيديو (.mp4)">
                <button onclick="addProduct()" class="btn btn-primary text-xs">
                    <i class="fas fa-plus"></i> إضافة للمتجر
                </button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-400">المنتجات الحالية (<span id="pCount">0</span>)</span>
                    <button onclick="clearProducts()" class="text-red-400 text-[10px] hover:underline">حذف الكل</button>
                </div>
                <div id="productList" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <div id="preview-section" class="preview-section">
        <div class="mobile-screen">
            <div class="store-logo" id="previewLogo">متجر الهدايا</div>
            <div id="reelsFeed" class="reels-feed"></div>
        </div>
    </div>
</div>

<div id="orderModal" class="fixed inset-0 bg-black/80 z-[9999] hidden justify-center items-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl animate-bounce-in">
        <div class="bg-gray-50 p-4 border-b text-center">
            <h3 class="font-bold text-gray-800">تأكيد الطلب</h3>
        </div>
        <div class="p-4">
            <div id="orderSummary" class="mb-4 text-sm text-gray-600 bg-gray-100 p-3 rounded text-center"></div>
            <form onsubmit="submitOrder(event)" class="space-y-3">
                <input type="text" name="name" required placeholder="الاسم الكامل" class="w-full p-3 border rounded bg-gray-50 text-black text-sm">
                <input type="tel" name="phone" required placeholder="رقم الهاتف" class="w-full p-3 border rounded bg-gray-50 text-black text-sm text-left ltr">
                <input type="text" name="address" required placeholder="الولاية / العنوان" class="w-full p-3 border rounded bg-gray-50 text-black text-sm">
                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition">تأكيد الطلب الآن</button>
            </form>
        </div>
        <div class="p-3 bg-gray-50 text-center">
            <button onclick="document.getElementById('orderModal').style.display='none'" class="text-xs text-gray-500 underline">إلغاء</button>
        </div>
    </div>
</div>

<script>
    // === المتغيرات العامة ===
    let App = {
        products: [],
        settings: { storeName: 'متجر الهدايا', currency: 'د.ج', shipping: 400, whatsapp: '213555123456' }
    };

    // === عند التحميل ===
    window.onload = function() {
        // التحقق هل نحن في وضع "المتجر المباشر" أم "المحرر"
        if (window.STORE_DATA) {
            // وضع المتجر (للزائر)
            App.products = window.STORE_DATA.products || [];
            App.settings = window.STORE_DATA.settings || App.settings;
            document.body.classList.add('fullscreen-mode'); // إخفاء لوحة التحكم
            updatePreview();
        } else {
            // وضع المحرر (لك أنت)
            renderProductList();
            updatePreview();
        }
    };

    // === دوال إدارة المنتجات ===
    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const old = document.getElementById('pOld').value;
        const video = document.getElementById('pVideo').value;

        if (!name || !price || !video) return alert('يرجى ملء الاسم والسعر والفيديو');

        App.products.unshift({
            id: Date.now(),
            name, price, old, video
        });

        renderProductList();
        updatePreview();
        
        // تنظيف الحقول
        document.getElementById('pName').value = '';
        document.getElementById('pVideo').value = '';
    }

    function removeProduct(id) {
        App.products = App.products.filter(p => p.id !== id);
        renderProductList();
        updatePreview();
    }

    function clearProducts() {
        if(confirm('حذف كل المنتجات؟')) {
            App.products = [];
            renderProductList();
            updatePreview();
        }
    }

    function renderProductList() {
        const list = document.getElementById('productList');
        document.getElementById('pCount').innerText = App.products.length;
        
        list.innerHTML = App.products.map(p => `
            <div class="flex justify-between items-center bg-slate-800 p-2 rounded text-xs mb-1 border border-slate-700">
                <span class="truncate text-white flex-1">${p.name}</span>
                <button onclick="removeProduct(${p.id})" class="text-red-400 hover:text-red-300 px-2"><i class="fas fa-trash"></i></button>
            </div>
        `).join('');
    }

    // === تحديث المعاينة ===
    function updatePreview() {
        // تحديث الإعدادات من الحقول
        if (!document.body.classList.contains('fullscreen-mode')) {
            App.settings.storeName = document.getElementById('storeName').value;
            App.settings.currency = document.getElementById('currency').value;
            App.settings.shipping = document.getElementById('shippingPrice').value;
            App.settings.whatsapp = document.getElementById('whatsappNumber').value;
        }

        document.getElementById('previewLogo').innerText = App.settings.storeName;
        
        const feed = document.getElementById('reelsFeed');
        if (App.products.length === 0) {
            feed.innerHTML = '<div class="flex items-center justify-center h-full text-gray-500">لا توجد منتجات</div>';
            return;
        }

        feed.innerHTML = App.products.map(p => `
            <div class="reel-item">
                <video class="reel-video" src="${p.video}" loop muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                <div class="reel-content">
                    <h2 class="text-xl font-bold mb-2 drop-shadow-md">${p.name}</h2>
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-2xl font-black text-green-400 drop-shadow-md">${p.price} ${App.settings.currency}</span>
                        ${p.old ? `<span class="text-sm line-through text-gray-400">${p.old}</span>` : ''}
                    </div>
                    <button onclick="openOrderModal('${p.name}', '${p.price}')" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition shadow-lg">
                        اطلب الآن 🛍️
                    </button>
                </div>
            </div>
        `).join('');

        // تشغيل الفيديو الأول تلقائياً
        setTimeout(() => {
            const v = document.querySelector('video');
            if(v) v.play().catch(() => v.muted = true);
        }, 500);
    }

    // === نظام الطلب ===
    let currentItem = {};
    function openOrderModal(name, price) {
        currentItem = { name, price };
        const total = parseFloat(price) + parseFloat(App.settings.shipping);
        document.getElementById('orderSummary').innerHTML = `
            <b>المنتج:</b> ${name}<br>
            <b>السعر:</b> ${price} ${App.settings.currency}<br>
            <b>التوصيل:</b> ${App.settings.shipping} ${App.settings.currency}<br>
            <hr class="my-2">
            <b>المجموع: ${total} ${App.settings.currency}</b>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function submitOrder(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        
        const msg = `طلب جديد! 🔥\n📦 المنتج: ${currentItem.name}\n💰 السعر: ${currentItem.price}\n👤 الاسم: ${data.name}\n📱 الهاتف: ${data.phone}\n📍 العنوان: ${data.address}`;
        
        window.open(`https://wa.me/${App.settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
        document.getElementById('orderModal').style.display = 'none';
    }

    // === دالة النشر (المهمة جداً) ===
    async function publishStoreOnline() {
        const slug = document.getElementById('storeSlug').value.trim();
        if (!slug) return alert('⚠️ يرجى كتابة "اسم الرابط" أولاً (بالانجليزية)');

        const btn = document.getElementById('pubBtn');
        btn.innerText = 'جاري النشر...';
        btn.disabled = true;

        const storeData = {
            products: App.products,
            settings: App.settings
        };

        try {
            const res = await fetch('/publish-vid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug: slug, data: storeData })
            });
            const result = await res.json();
            
            if (result.success) {
                const url = window.location.origin + '/v/' + slug;
                prompt('✅ تم نشر المتجر بنجاح! انسخ الرابط:', url);
                window.open(url, '_blank');
            } else {
                alert('❌ خطأ: اسم الرابط مستخدم من قبل');
            }
        } catch (err) {
            alert('حدث خطأ في الاتصال');
        }
        
        btn.innerText = 'نشر 🌍';
        btn.disabled = false;
    }

    // === دالة التحميل (HTML) ===
    function downloadStore() {
        if(App.products.length === 0) return alert('أضف منتجات أولاً');
        
        // ننسخ الكود الحالي ونحقن فيه البيانات
        const htmlContent = document.documentElement.outerHTML.replace(
            '// وضع المحرر (لك أنت)', 
            `window.STORE_DATA = ${JSON.stringify({ products: App.products, settings: App.settings })};`
        );
        
        const blob = new Blob([htmlContent], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'VidStore.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
</body>
</html>
