<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidShop Pro - منصة SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black mb-4 bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
            VidShop Pro
        </h1>
        <p class="text-gray-400 mb-12 text-xl">منصة SaaS لبناء المتاجر</p>

        <div class="grid md:grid-cols-2 gap-6 max-w-2xl w-full">
            <a href="/builder" class="bg-gradient-to-r from-pink-500 to-violet-500 p-8 rounded-2xl text-center hover:scale-105 transition shadow-2xl">
                <i class="fas fa-paint-brush text-5xl mb-4"></i>
                <h2 class="text-2xl font-bold">صفحات الهبوط</h2>
                <p class="text-white/70 mt-2">أداة بناء صفحات الهبوط</p>
            </a>

            <a href="/tool2" class="bg-gradient-to-r from-cyan-500 to-emerald-500 p-8 rounded-2xl text-center hover:scale-105 transition shadow-2xl">
                <i class="fas fa-video text-5xl mb-4"></i>
                <h2 class="text-2xl font-bold">متجر الفيديو</h2>
                <p class="text-white/70 mt-2">VidShop Pro - متجر تفاعلي</p>
            </a>
        </div>

        <p class="mt-12 text-gray-500 text-sm">© 2024 VidShop Pro - جميع الحقوق محفوظة</p>
    </div>
</body>
</html>
