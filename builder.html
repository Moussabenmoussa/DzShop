
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; height: 100vh; overflow: hidden; }
        /* وضع العرض للزوار */
        body.view-mode { background: #fff !important; overflow: auto !important; }
        body.view-mode .editor-panel { display: none !important; }
        body.view-mode .preview-panel { display: block !important; width: 100% !important; background: #fff !important; padding: 0 !important; }
        body.view-mode .mobile-frame { width: 100% !important; max-width: 480px !important; margin: 0 auto !important; height: auto !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; }
        
        /* باقي الستايلات للمحرر */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .editor-panel { width: 400px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; z-index: 20; flex-shrink: 0; }
        .preview-panel { flex: 1; background: #0f172a; display: flex; align-items: center; justify-content: center; }
        .mobile-frame { width: 375px; height: 95%; max-height: 800px; background: #fff; border-radius: 30px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; color: white; margin-bottom: 10px; }
        .stat-badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 10px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="editorPanel" class="editor-panel">
        <div class="p-4 bg-slate-900 border-b border-gray-700 sticky top-0 z-20">
            <h1 class="text-white font-bold flex items-center">
                LandShop <span id="storeCounter" class="stat-badge">Loading...</span>
            </h1>
            <div class="flex gap-2 mt-3">
                <input type="text" id="pSlug" class="flex-1 bg-slate-800 border-none text-white text-xs px-2 rounded" placeholder="اسم الرابط (Slug)">
                <button onclick="publishPage()" id="pubBtn" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">نشر / حفظ</button>
            </div>
        </div>

        <div class="p-5 pb-20 space-y-4">
            <input type="text" id="pName" class="input" placeholder="اسم المنتج" oninput="up()">
            <div class="flex gap-2">
                <input type="number" id="pPrice" class="input" placeholder="السعر" oninput="up()">
                <input type="number" id="pOld" class="input" placeholder="قبل الخصم" oninput="up()">
            </div>
            <textarea id="pDesc" class="input" rows="3" placeholder="الوصف" oninput="up()"></textarea>
            <textarea id="pImages" class="input ltr text-left" rows="3" placeholder="روابط الصور" oninput="up()">https://via.placeholder.com/400</textarea>
            <input type="text" id="whatsapp" class="input" placeholder="رقم الواتساب" oninput="up()">
            
            <div class="bg-slate-800 p-3 rounded text-xs text-gray-400">
                <p>💡 نصيحة: بعد النشر، احفظ رابط التعديل لتعود له لاحقاً.</p>
            </div>
        </div>
    </div>

    <div class="preview-panel">
        <div class="mobile-frame">
            <div class="h-64 bg-gray-200 relative"><img id="vImg" class="w-full h-full object-cover"></div>
            <div class="p-5 flex-1 overflow-y-auto">
                <h1 id="vName" class="text-xl font-bold mb-2">اسم المنتج</h1>
                <div class="flex gap-2 items-end mb-4">
                    <span id="vPrice" class="text-2xl font-bold text-red-600">0</span>
                    <span id="vOld" class="text-sm line-through text-gray-400"></span>
                    <span class="font-bold">د.ج</span>
                </div>
                <p id="vDesc" class="text-gray-600 text-sm whitespace-pre-line leading-7"></p>
                
                <div id="orderForm" class="mt-6 p-4 bg-gray-50 rounded-xl border">
                    <h3 class="font-bold text-center mb-3">للطلب املأ الاستمارة</h3>
                    <input id="cn" class="w-full p-2 border rounded mb-2" placeholder="الاسم">
                    <input id="cp" class="w-full p-2 border rounded mb-2" placeholder="الهاتف" type="tel">
                    <input id="cw" class="w-full p-2 border rounded mb-2" placeholder="الولاية">
                    <button onclick="send()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">تأكيد الطلب (واتساب)</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // === 1. منطق العرض والزوار ===
    if (window.VIEW_MODE && window.PAGE_DATA) {
        document.body.classList.add('view-mode');
        const d = window.PAGE_DATA;
        // ملء البيانات للعرض
        document.getElementById('vName').innerText = d.name;
        document.getElementById('vPrice').innerText = d.price;
        document.getElementById('vOld').innerText = d.old;
        document.getElementById('vDesc').innerText = d.desc;
        document.getElementById('vImg').src = d.imgs[0];
        window.waNum = d.conf.wa;
    } 
    // === 2. منطق المحرر (Editor) ===
    else {
        // جلب الإحصائيات
        fetch('/stats').then(r=>r.json()).then(d => {
            document.getElementById('storeCounter').innerText = d.total + ' متجر';
        });

        // إذا كنا في وضع التعديل (Edit Mode)
        if (window.EDIT_MODE && window.OLD_DATA) {
            const d = window.OLD_DATA;
            // تعبئة الحقول بالبيانات القديمة
            document.getElementById('pSlug').value = window.location.pathname.split('/').pop();
            document.getElementById('pSlug').disabled = true; // منع تغيير الرابط عند التعديل
            document.getElementById('pName').value = d.name;
            document.getElementById('pPrice').value = d.price;
            document.getElementById('pOld').value = d.old;
            document.getElementById('pDesc').value = d.desc;
            document.getElementById('pImages').value = d.imgs.join('\n');
            document.getElementById('whatsapp').value = d.conf.wa;
            
            document.getElementById('pubBtn').innerText = "حفظ التعديلات 💾";
            up(); // تحديث المعاينة
        }
    }

    // تحديث المعاينة (Editor Only)
    function up() {
        if(window.VIEW_MODE) return;
        document.getElementById('vName').innerText = document.getElementById('pName').value;
        document.getElementById('vPrice').innerText = document.getElementById('pPrice').value;
        document.getElementById('vOld').innerText = document.getElementById('pOld').value;
        document.getElementById('vDesc').innerText = document.getElementById('pDesc').value;
        const imgs = document.getElementById('pImages').value.split('\n');
        document.getElementById('vImg').src = imgs[0] || '';
    }

    // النشر
    async function publishPage() {
        const slug = document.getElementById('pSlug').value.trim();
        if(!slug) return alert('اسم الرابط مطلوب');
        
        const data = {
            slug: slug,
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            old: document.getElementById('pOld').value,
            desc: document.getElementById('pDesc').value,
            imgs: document.getElementById('pImages').value.split('\n'),
            conf: { wa: document.getElementById('whatsapp').value },
            seo: { title: document.getElementById('pName').value, desc: '', keys: '' } // تبسيط
        };

        const btn = document.getElementById('pubBtn');
        btn.innerText = 'جاري الحفظ...';

        try {
            const res = await fetch('/publish', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const r = await res.json();
            if(r.success) {
                const liveLink = window.location.origin + '/p/' + slug;
                const editLink = window.location.origin + '/edit/p/' + slug;
                
                // عرض الروابط للمستخدم
                const msg = `✅ تم الحفظ بنجاح!\n\n🔗 رابط الزبائن (انشره):\n${liveLink}\n\n✏️ رابط التعديل (احفظه عندك):\n${editLink}`;
                prompt("انسخ رابط الزبائن:", liveLink);
                prompt("انسخ رابط التعديل السري:", editLink);
            } else {
                alert('الاسم مستخدم من قبل');
            }
        } catch(e) { alert('خطأ'); }
        btn.innerText = 'نشر / حفظ';
    }

    // إرسال الطلب (View Mode Only)
    function send() {
        const n = document.getElementById('cn').value;
        const p = document.getElementById('cp').value;
        const w = document.getElementById('cw').value;
        const msg = `طلب جديد: ${document.getElementById('vName').innerText} - السعر: ${document.getElementById('vPrice').innerText} - الاسم: ${n} - الهاتف: ${p}`;
        const num = window.waNum || window.OLD_DATA?.conf.wa || '213555';
        window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
