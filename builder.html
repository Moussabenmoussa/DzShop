
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LandShop Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; height: 100vh; overflow: hidden; }
        
        /* هذا السطر هو الحل لمشكلة الوميض: المحرر مخفي افتراضياً */
        #main-app { display: none; height: 100vh; width: 100vw; }

        .editor-panel { width: 400px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; z-index: 20; flex-shrink: 0; }
        .preview-panel { flex: 1; background: #0f172a; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; position: relative; overflow: hidden; }
        .mobile-frame { width: 100%; max-width: 375px; height: 95%; max-height: 800px; background: #fff; border-radius: 30px; border: 8px solid #334155; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; color: white; font-size: 13px; margin-bottom: 12px; transition: 0.2s; }
        .input:focus { border-color: #3b82f6; outline: none; background: #162032; }
        .label { display: block; color: #94a3b8; font-size: 11px; margin-bottom: 5px; font-weight: bold; }
        .section-title { font-weight: 800; color: white; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid #334155; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .lp-scroll { flex: 1; overflow-y: auto; background: #f8fafc; padding-bottom: 80px; scroll-behavior: smooth; }
        .lp-scroll::-webkit-scrollbar { width: 4px; }
        .lp-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .store-badge { background: #ec4899; color: white; padding: 2px 8px; border-radius: 12px; font-size: 10px; margin-right: 5px; }

        @media (max-width: 800px) {
            .app-container { flex-direction: column; }
            .editor-panel { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
            .preview-panel { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; padding: 0; }
            .mobile-frame { width: 100%; height: 100%; max-width: 100%; border: none; border-radius: 0; }
            .mobile-tabs { display: flex !important; }
            .editor-panel.hidden-mobile, .preview-panel.hidden-mobile { display: none; }
        }
        .mobile-tabs { display: none; position: fixed; bottom: 0; width: 100%; background: #1e293b; z-index: 1000; height: 50px; border-top: 1px solid #334155; }
        .tab-btn { flex: 1; background: none; border: none; color: #94a3b8; font-weight: bold; font-size: 14px; }
        .tab-btn.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); border-top: 2px solid #3b82f6; }
    </style>
</head>
<body>

<div id="main-app" class="app-container">
    
    <div id="editorPanel" class="editor-panel custom-scroll">
        <div class="p-4 bg-slate-900 border-b border-gray-700 sticky top-0 z-20 flex justify-between items-center shadow-lg gap-2">
            <h1 class="text-white font-black text-sm flex items-center gap-2">
                <i class="fas fa-layer-group text-blue-500"></i> LandShop
                <span id="storeCounter" class="store-badge">...</span>
            </h1>
            
            <div class="flex gap-2 mr-auto">
                <button onclick="publishPage()" id="pubBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition active:scale-95">
                    <span>نشر / حفظ</span> <i class="fas fa-globe"></i> 
                </button>
                <button onclick="downloadPage()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition active:scale-95">
                    <span>تحميل</span> <i class="fas fa-download"></i> 
                </button>
            </div>
        </div>

        <div class="p-5 pb-20 space-y-6">
            
            <div class="bg-blue-900/20 p-3 rounded-xl border border-blue-900/50">
                <div class="section-title"><i class="fas fa-link text-blue-400"></i> رابط الصفحة (Slug)</div>
                <input type="text" id="pSlug" class="input text-left ltr" placeholder="مثال: headphones-pro" required>
                <p class="text-[10px] text-gray-400">الرابط: /p/<b>اسم-الرابط</b></p>
            </div>

            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <div class="section-title"><i class="fas fa-search text-green-400"></i> إعدادات السيو (SEO)</div>
                <div class="space-y-2">
                    <input type="text" id="seoTitle" class="input" placeholder="عنوان الصفحة">
                    <textarea id="seoDesc" rows="2" class="input text-xs" placeholder="وصف البحث"></textarea>
                    <input type="text" id="seoKeys" class="input text-xs" placeholder="الكلمات المفتاحية">
                </div>
            </div>

            <div>
                <div class="section-title"><i class="fas fa-box-open text-blue-400"></i> تفاصيل المنتج</div>
                <input type="text" id="pName" value="سماعات بلوتوث" class="input" placeholder="اسم المنتج" oninput="updatePreview()">
                <div class="flex gap-2">
                    <input type="number" id="pPrice" value="2900" class="input" placeholder="السعر" oninput="updatePreview()">
                    <input type="number" id="pOld" value="4500" class="input" placeholder="السعر القديم" oninput="updatePreview()">
                </div>
                <textarea id="pImages" rows="3" class="input text-left ltr" placeholder="رابط صورة في كل سطر" oninput="updatePreview()">https://i.imgur.com/G5qW0rF.png</textarea>
                <textarea id="pDesc" rows="3" class="input" placeholder="وصف المنتج..." oninput="updatePreview()">وصف للمنتج...</textarea>
            </div>

            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <div class="section-title"><i class="fas fa-map-marked-alt text-green-400"></i> مناطق التوصيل</div>
                <textarea id="pWilayas" rows="4" class="input h-24 text-xs" oninput="updatePreview()">01. أدرار
16. الجزائر</textarea>
                <textarea id="pCommunes" rows="6" class="input h-32 text-xs" oninput="updatePreview()">01. أدرار: أدرار وسط
16. الجزائر: الجزائر الوسطى</textarea>
            </div>

            <div>
                 <div class="section-title"><i class="fas fa-sliders-h text-yellow-400"></i> الخيارات والإرسال</div>
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-gray-300 font-bold">تفعيل المقاسات</span>
                    <input type="checkbox" id="enableSizes" class="accent-blue-500 h-4 w-4" onchange="updatePreview()">
                </div>
                <input type="text" id="pSizes" value="Standard" class="input mb-3" oninput="updatePreview()">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-gray-300 font-bold">تفعيل الألوان</span>
                    <input type="checkbox" id="enableColors" checked class="accent-blue-500 h-4 w-4" onchange="updatePreview()">
                </div>
                <input type="text" id="pColors" value="#000000, #EF4444, #3B82F6" class="input text-left ltr mb-4" oninput="updatePreview()">
                
                <select id="sendMethod" class="input" onchange="updatePreview()">
                    <option value="both">إيميل + واتساب</option>
                    <option value="whatsapp">واتساب فقط</option>
                    <option value="email">إيميل فقط</option>
                </select>
                <input type="text" id="whatsapp" value="213555123456" class="input text-left ltr" placeholder="WhatsApp Number">
                <input type="email" id="email" class="input text-left ltr" placeholder="Email (FormSubmit)">
                <input type="text" id="sheet" class="input text-left ltr" placeholder="Google Sheet URL">
                <input type="number" id="shipping" value="400" class="input" placeholder="سعر التوصيل">
            </div>
        </div>
    </div>

    <div id="previewPanel" class="preview-panel hidden-mobile">
        <div class="mobile-frame">
            <div class="bg-red-600 text-white text-[10px] text-center py-2 font-bold sticky top-0 z-10 shadow-md">
                ⚡ عرض محدود: ينتهي خلال <span class="bg-black/20 px-1 rounded font-mono mx-1">02:30:00</span>
            </div>
            <div class="lp-scroll">
                <div id="prevSlider" class="h-72 bg-gray-200 relative group"></div>
                <div class="bg-white rounded-t-3xl relative -mt-6 p-5 min-h-[500px] shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
                    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
                    <h2 class="text-xl font-black text-slate-800 leading-snug mb-2" id="prevName">...</h2>
                    <div class="flex items-end gap-2 mb-5">
                        <span class="text-3xl font-black text-red-600" id="prevPrice">00</span>
                        <span class="text-sm text-gray-400 line-through mb-1" id="prevOld">00</span>
                        <span class="text-sm font-bold text-slate-800 mb-1">د.ج</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        <div class="bg-blue-50 p-2 rounded-lg text-center border border-blue-100"><i class="fas fa-truck text-blue-500 mb-1"></i><div class="text-[9px] font-bold text-blue-800">توصيل سريع</div></div>
                        <div class="bg-green-50 p-2 rounded-lg text-center border border-green-100"><i class="fas fa-money-bill-wave text-green-500 mb-1 block"></i><span class="text-[10px] font-bold text-green-800">عند الاستلام</span></div>
                        <div class="bg-purple-50 p-2 rounded-lg text-center border border-purple-100"><i class="fas fa-award text-purple-500 mb-1 block"></i><span class="text-[10px] font-bold text-purple-800">ضمان الجودة</span></div>
                    </div>
                    <div id="prevVariants"></div>
                    <div class="mt-6 pt-4 border-t border-gray-100">
                        <h3 class="font-bold text-sm mb-2 text-slate-800">الوصف:</h3>
                        <div class="text-sm text-gray-600 whitespace-pre-line leading-relaxed" id="prevDesc"></div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 mt-8 pb-8">
                        <div class="text-center mb-4"><h3 class="font-bold text-slate-800 text-lg">أطلب الآن</h3></div>
                        <div class="space-y-3">
                            <div class="bg-white border rounded-lg h-11 px-3 flex items-center text-sm text-gray-400">الاسم واللقب</div>
                            <div class="bg-white border rounded-lg h-11 px-3 flex items-center text-sm text-gray-400">رقم الهاتف</div>
                            <select id="prevWilayaSelect" class="bg-white border rounded-lg h-11 w-full px-3 text-sm appearance-none font-bold text-slate-700 outline-none" onchange="refreshPrevCommunes()"><option>اختر الولاية...</option></select>
                            <select id="prevCommuneSelect" class="bg-white border rounded-lg h-11 w-full px-3 text-sm appearance-none text-slate-700 outline-none"><option value="">البلدية...</option></select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-white border-t shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-20">
                <button id="prevBtn" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 text-lg shadow-lg"><span>تأكيد الطلب</span> <i class="fas fa-arrow-left"></i></button>
            </div>
        </div>
    </div>
</div>

<div class="mobile-tabs">
    <button class="tab-btn active" onclick="switchTab('editor', this)"><i class="fas fa-edit block mb-1"></i> المحرر</button>
    <button class="tab-btn" onclick="switchTab('preview', this)"><i class="fas fa-mobile-alt block mb-1"></i> المعاينة</button>
</div>

<script>
    // === التحكم في العرض والإخفاء ===
    window.onload = function() {
        // 1. وضع الزائر (الرابط المباشر)
        if (window.LIVE_DATA) {
            // لا نظهر المحرر أبداً، نستبدل الصفحة فوراً
            document.open();
            document.write(generateFinalHTML(window.LIVE_DATA));
            document.close();
            return;
        }

        // 2. وضع المحرر (أو التعديل)
        // الآن نظهر واجهة المحرر لأننا تأكدنا أنه ليس زائراً
        document.getElementById('main-app').style.display = 'flex';

        fetch('/stats').then(r=>r.json()).then(d=>{
            document.getElementById('storeCounter').innerText = d.total + ' متجر';
        });

        if (window.OLD_DATA) {
            loadOldData(window.OLD_DATA);
        } else {
            updatePreview();
        }
    };

    function loadOldData(d) {
        document.getElementById('pSlug').value = window.location.pathname.split('/').pop();
        document.getElementById('pSlug').disabled = true; // منع تغيير الرابط عند التعديل للحفاظ على الـ ID
        
        document.getElementById('pName').value = d.name;
        document.getElementById('pPrice').value = d.price;
        document.getElementById('pOld').value = d.old;
        document.getElementById('pDesc').value = d.desc;
        document.getElementById('pImages').value = d.imgs.join('\n');
        
        if(d.wilayas) document.getElementById('pWilayas').value = d.wilayas.join('\n');
        
        document.getElementById('seoTitle').value = d.seo.title;
        document.getElementById('seoDesc').value = d.seo.desc;
        document.getElementById('seoKeys').value = d.seo.keys;
        
        document.getElementById('whatsapp').value = d.conf.wa;
        document.getElementById('shipping').value = d.conf.ship;

        document.getElementById('pubBtn').innerHTML = "<span>حفظ التعديلات</span> <i class='fas fa-save'></i>";
        updatePreview();
    }

    // === باقي الدوال ===
    function parseCommunes(text) { const map = {}; text.split('\n').forEach(line => { if(line.includes(':')) { const [wilaya, comms] = line.split(':'); if(wilaya && comms) map[wilaya.trim()] = comms.split(/,|،/).map(c => c.trim()).filter(c => c); } }); return map; }
    
    function updatePreview() {
        const name = document.getElementById('pName').value;
        const imgs = document.getElementById('pImages').value.split('\n').filter(x => x.trim());
        const wilayas = document.getElementById('pWilayas').value.split('\n').filter(x => x.trim());

        document.getElementById('prevName').innerText = name;
        document.getElementById('prevPrice').innerText = document.getElementById('pPrice').value;
        document.getElementById('prevOld').innerText = document.getElementById('pOld').value;
        document.getElementById('prevDesc').innerHTML = document.getElementById('pDesc').value.replace(/\n/g, '<br>');

        const slider = document.getElementById('prevSlider');
        slider.innerHTML = imgs.length ? `<img src="${imgs[0]}" class="w-full h-full object-cover">` : '<div class="flex items-center justify-center h-full text-gray-400">لا توجد صور</div>';

        let vHtml = '';
        if(document.getElementById('enableSizes').checked) vHtml += `<div class="mt-4"><div class="text-xs font-bold mb-2 text-slate-700">المقاس:</div><div class="flex gap-2 flex-wrap">${document.getElementById('pSizes').value.split(',').map(s=>`<span class="border border-gray-300 px-3 py-1.5 rounded-lg bg-white text-xs font-bold text-gray-600 shadow-sm">${s.trim()}</span>`).join('')}</div></div>`;
        if(document.getElementById('enableColors').checked) vHtml += `<div class="mt-4"><div class="text-xs font-bold mb-2 text-slate-700">اللون:</div><div class="flex gap-2">${document.getElementById('pColors').value.split(',').map(c=>`<span class="w-8 h-8 rounded-full border-2 border-white ring-1 ring-gray-200 shadow-sm" style="background:${c.trim()}"></span>`).join('')}</div></div>`;
        document.getElementById('prevVariants').innerHTML = vHtml;

        const wSelect = document.getElementById('prevWilayaSelect');
        wSelect.innerHTML = '<option value="">اختر الولاية...</option>' + wilayas.map(w => `<option value="${w}">${w}</option>`).join('');
        refreshPrevCommunes();

        const method = document.getElementById('sendMethod').value;
        const btn = document.getElementById('prevBtn');
        if(method === 'whatsapp') {
            btn.className = "w-full bg-[#25D366] text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 text-lg shadow-lg shadow-green-100";
            btn.innerHTML = '<span>اطلب عبر واتساب</span> <i class="fab fa-whatsapp text-2xl"></i>';
        } else {
            btn.className = "w-full bg-red-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 text-lg shadow-lg shadow-red-200";
            btn.innerHTML = '<span>تأكيد الطلب الآن</span> <i class="fas fa-check-circle"></i>';
        }
    }

    function refreshPrevCommunes() {
        const wVal = document.getElementById('prevWilayaSelect').value;
        const cSelect = document.getElementById('prevCommuneSelect');
        const commMap = parseCommunes(document.getElementById('pCommunes').value);
        cSelect.innerHTML = '<option value="">البلدية...</option>';
        if(wVal && commMap[wVal]) commMap[wVal].forEach(c => cSelect.innerHTML += `<option value="${c}">${c}</option>`);
        else if(wVal) cSelect.innerHTML = '<option value="المركز / غير محدد">المركز / غير محدد</option>';
    }

    function switchTab(t, btn) {
        document.getElementById('editorPanel').classList.toggle('hidden-mobile', t !== 'editor');
        document.getElementById('previewPanel').classList.toggle('hidden-mobile', t !== 'preview');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function getDataObject() {
        return {
            slug: document.getElementById('pSlug').value.trim(),
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            old: document.getElementById('pOld').value,
            desc: document.getElementById('pDesc').value,
            imgs: document.getElementById('pImages').value.split('\n').filter(x=>x.trim()),
            wilayas: document.getElementById('pWilayas').value.split('\n').filter(x=>x.trim()),
            communes: parseCommunes(document.getElementById('pCommunes').value),
            sizes: document.getElementById('enableSizes').checked ? document.getElementById('pSizes').value.split(',') : [],
            colors: document.getElementById('enableColors').checked ? document.getElementById('pColors').value.split(',') : [],
            seo: {
                title: document.getElementById('seoTitle').value || document.getElementById('pName').value,
                desc: document.getElementById('seoDesc').value || document.getElementById('pDesc').value.substring(0, 150),
                keys: document.getElementById('seoKeys').value
            },
            conf: {
                method: document.getElementById('sendMethod').value,
                wa: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                sheet: document.getElementById('sheet').value,
                ship: document.getElementById('shipping').value
            }
        };
    }

    function downloadPage() {
        const d = getDataObject();
        const html = generateFinalHTML(d);
        const b = new Blob([html],{type:'text/html'});
        const a = document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download='LandShop_Page.html';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
    }

    async function publishPage() {
        const d = getDataObject();
        if(!d.slug) return alert('⚠️ يرجى كتابة "رابط الصفحة" (Slug) أولاً!');

        const btn = document.getElementById('pubBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';
        btn.disabled = true;

        try {
            const res = await fetch('/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(d)
            });
            const result = await res.json();
            
            if(result.success) {
                const liveLink = window.location.origin + '/p/' + d.slug;
                const editLink = window.location.origin + '/edit/p/' + d.slug;
                
                // إضافة timestamp لمنع المتصفح من فتح النسخة القديمة (Cache busting)
                const liveLinkFresh = liveLink + '?t=' + Date.now();
                const editLinkFresh = editLink + '?t=' + Date.now();

                prompt("✅ رابط الزبائن (تم التحديث):", liveLinkFresh);
                prompt("🔑 رابط التعديل (سري لك):", editLinkFresh);
                
                window.open(liveLinkFresh, '_blank');
            } else {
                alert("❌ خطأ: اسم الرابط مستخدم");
            }
        } catch(err) { alert("حدث خطأ"); }
        
        btn.innerHTML = '<span>نشر / حفظ</span> <i class="fas fa-globe"></i>';
        btn.disabled = false;
    }

    function generateFinalHTML(d) {
        const jsonLd = { "@context": "https://schema.org/", "@type": "Product", "name": d.name, "image": d.imgs, "description": d.seo.desc, "offers": { "@type": "Offer", "priceCurrency": "DZD", "price": d.price, "availability": "https://schema.org/InStock" } };
        
        return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>${d.seo.title}</title>
<meta name="description" content="${d.seo.desc}">
<meta name="keywords" content="${d.seo.keys}">
<meta property="og:title" content="${d.seo.title}">
<meta property="og:description" content="${d.seo.desc}">
<meta property="og:image" content="${d.imgs[0]}">
<script src="https://cdn.tailwindcss.com"><\/script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="application/ld+json">${JSON.stringify(jsonLd)}<\/script>
<style>
body{font-family:'Tajawal',sans-serif;background:#fff}
.slide{display:none;width:100%;height:100%;object-fit:cover}.slide.active{display:block;animation:f 0.5s}@keyframes f{from{opacity:0.7}to{opacity:1}}
.opt{border:1px solid #e2e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;background:#fff;font-size:13px;font-weight:700;color:#475569}.opt.active{background:#1e293b;color:#fff;border-color:#1e293b}
.col{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #e2e8f0;cursor:pointer}.col.active{box-shadow:0 0 0 2px #1e293b;transform:scale(1.1)}
select{-webkit-appearance:none;appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9'></polyline></svg>") no-repeat left 0.75rem center;background-size:1em;background-color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:#10b981;color:#fff;padding:12px 24px;border-radius:30px;transition:0.4s;z-index:9999;font-weight:700;box-shadow:0 10px 30px rgba(16,185,129,0.3);width:max-content}.toast.show{transform:translate(-50%,20px)}
@media(min-width:768px){body{background:#f1f5f9;padding-bottom:50px}.main-card{max-width:450px;margin:30px auto;border-radius:20px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.1);overflow:hidden;background:#fff;min-height:90vh}.sticky-nav{max-width:450px;margin:0 auto;border-radius:0 0 20px 20px}}
</style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 md:pb-0">
<div class="main-card relative">
<div class="bg-red-600 text-white text-center py-2 text-xs font-bold sticky top-0 z-40 shadow-sm">⚡ عرض محدود: <span id="tm" class="bg-white/20 px-1 rounded mx-1">00:00:00</span></div>
<div class="relative h-[350px] bg-gray-100 group">
${d.imgs.map((m,i)=>`<img src="${m}" class="slide ${i==0?'active':''}" alt="${d.name}" ${i>0?'loading="lazy"':''}>`).join('')}
${d.imgs.length>1?`<button onclick="mv(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/30 text-white rounded-full flex items-center justify-center backdrop-blur-sm">❮</button><button onclick="mv(1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/30 text-white rounded-full flex items-center justify-center backdrop-blur-sm">❯</button>`:''}
</div>
<div class="p-6 -mt-8 bg-white relative z-20 rounded-t-[30px] shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
<div class="w-12 h-1.5 bg-gray-100 rounded-full mx-auto mb-4"></div>
<h1 class="text-2xl font-black text-slate-900 leading-snug mb-2">${d.name}</h1>
<div class="flex items-end gap-3 mb-6"><span class="text-4xl font-black text-red-600">${d.price}</span><span class="text-gray-400 line-through pb-1">${d.old||''}</span><span class="font-bold text-slate-800 pb-1">د.ج</span></div>
<div class="grid grid-cols-3 gap-2 mb-6">
<div class="bg-blue-50 p-2 rounded-lg text-center border border-blue-100"><i class="fas fa-truck text-blue-500 mb-1 block"></i><span class="text-[10px] font-bold text-blue-800">توصيل سريع</span></div>
<div class="bg-green-50 p-2 rounded-lg text-center border border-green-100"><i class="fas fa-money-bill-wave text-green-500 mb-1 block"></i><span class="text-[10px] font-bold text-green-800">عند الاستلام</span></div>
<div class="bg-purple-50 p-2 rounded-lg text-center border border-purple-100"><i class="fas fa-award text-purple-500 mb-1 block"></i><span class="text-[10px] font-bold text-purple-800">ضمان الجودة</span></div>
</div>
${d.sizes.length&&d.sizes[0]?`<div class="mb-4"><div class="text-xs font-bold mb-2 text-slate-700">المقاس:</div><div class="flex flex-wrap gap-2">${d.sizes.map((s,i)=>`<div class="opt ${i==0?'active':''}" onclick="sS(this,'${s.trim()}')">${s.trim()}</div>`).join('')}</div></div>`:''}
${d.colors.length&&d.colors[0]?`<div class="mb-4"><div class="text-xs font-bold mb-2 text-slate-700">اللون:</div><div class="flex gap-2">${d.colors.map((c,i)=>`<div class="col ${i==0?'active':''}" style="background:${c.trim()}" onclick="sC(this,'${c.trim()}')"></div>`).join('')}</div></div>`:''}
<div class="border-t border-gray-100 pt-5 mt-5"><h3 class="font-bold text-slate-900 mb-2 flex items-center gap-2"><i class="far fa-file-alt text-gray-400"></i> الوصف:</h3><p class="text-sm text-gray-600 whitespace-pre-line leading-7">${d.desc}</p></div>
<div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 mt-8 pb-6" id="form">
<h2 class="text-center font-bold text-xl text-slate-800 mb-1">أطلب الآن!</h2><p class="text-center text-xs text-slate-500 mb-5">الدفع عند الاستلام</p>
<form onsubmit="sub(event)" class="space-y-3">
<div class="relative"><div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i class="far fa-user"></i></div><input id="n" required placeholder="الاسم واللقب" class="w-full h-12 pr-10 pl-3 border border-gray-300 rounded-lg focus:border-red-500 outline-none transition bg-white"></div>
<div class="relative"><div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i class="fas fa-phone-alt"></i></div><input id="p" required type="tel" placeholder="رقم الهاتف" class="w-full h-12 pr-10 pl-3 border border-gray-300 rounded-lg focus:border-red-500 outline-none transition bg-white text-right" dir="ltr"></div>
<select id="w" required class="w-full h-12 px-3 border border-gray-300 rounded-lg focus:border-red-500 outline-none transition bg-white text-gray-700" onchange="upC()"><option value="">اختر الولاية...</option>${d.wilayas.map(w=>`<option value="${w}">${w}</option>`).join('')}</select>
<select id="c" required class="w-full h-12 px-3 border border-gray-300 rounded-lg focus:border-red-500 outline-none transition bg-white text-gray-700" disabled><option value="">البلدية...</option></select>
</form></div><div class="h-10"></div></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-50 sticky-nav shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
<button onclick="document.querySelector('form').requestSubmit()" id="btn" class="w-full ${d.conf.method=='whatsapp'?'bg-[#25D366] active:bg-[#128C7E]':'bg-red-600 active:bg-red-700'} text-white font-bold h-14 rounded-xl shadow-lg flex justify-center items-center gap-3 text-lg transition-transform active:scale-[0.98]">
<span>${d.conf.method=='whatsapp'?'اطلب عبر واتساب':'تأكيد الطلب الآن'}</span><i class="${d.conf.method=='whatsapp'?'fab fa-whatsapp text-2xl':'fas fa-arrow-left'}"></i></button>
</div></div><div id="tst" class="toast"><i class="fas fa-check-circle"></i> تم تسجيل طلبك بنجاح!</div>
<script>
let sz='${d.sizes[0]?d.sizes[0].trim():''}',cl='${d.colors[0]?d.colors[0].trim():''}';const CM=${JSON.stringify(d.communes)};
function sS(e,v){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('active'));e.classList.add('active');sz=v}
function sC(e,v){document.querySelectorAll('.col').forEach(x=>x.classList.remove('active'));e.classList.add('active');cl=v}
function mv(d){let s=document.querySelectorAll('.slide'),c=0;s.forEach((e,i)=>{if(e.classList.contains('active'))c=i;e.classList.remove('active')});s[(c+d+s.length)%s.length].classList.add('active')}
function upC(){let w=document.getElementById('w').value,c=document.getElementById('c');c.innerHTML='<option value="">البلدية...</option>';if(CM[w]){CM[w].forEach(x=>c.innerHTML+='<option value="'+x+'">'+x+'</option>');c.disabled=0}else{c.innerHTML='<option value="المركز / غير محدد">المركز / غير محدد</option>';c.disabled=0}}
async function sub(e){e.preventDefault();let btn=document.getElementById('btn'),old=btn.innerHTML;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';btn.disabled=1;
let n=document.getElementById('n').value,p=document.getElementById('p').value,w=document.getElementById('w').value,c=document.getElementById('c').value,dt=[sz,cl].filter(Boolean).join('-'),tot=${d.price}+${d.conf.ship||0};
try{if('${d.conf.sheet}'){let f=new FormData();f.append('Date',new Date().toLocaleString());f.append('Name',n);f.append('Phone',p);f.append('Wilaya',w);f.append('Address',c);f.append('Product','${d.name}');f.append('Details',dt);fetch('${d.conf.sheet}',{method:'POST',body:f}).catch(()=>{})}
if('${d.conf.email}'&&'${d.conf.method}'!=='whatsapp'){await fetch('https://formsubmit.co/ajax/${d.conf.email}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({_subject:'طلب: ${d.name}',Name:n,Phone:p,Wilaya:w,Commune:c,Details:dt})})}
if('${d.conf.method}'!=='email'){window.location.href='https://wa.me/${d.conf.wa}?text='+encodeURIComponent('*طلب جديد*🔥\\n🛍️ ${d.name}\\n🎨 '+dt+'\\n💰 السعر: '+tot+'\\n👤 '+n+'\\n📱 '+p+'\\n📍 '+w+' - '+c)}
else{document.getElementById('tst').classList.add('show');btn.innerHTML=old;btn.disabled=0;document.querySelector('form').reset();setTimeout(()=>document.getElementById('tst').classList.remove('show'),3000)}}catch(e){alert('Error');btn.innerHTML=old;btn.disabled=0}}
setInterval(()=>{let d=new Date(),h=23-d.getHours(),m=59-d.getMinutes(),s=59-d.getSeconds();document.getElementById('tm').innerText=h+':'+m+':'+s},1000);
<\/script></body></html>`;
    }
</script>
</body>
    </html>
