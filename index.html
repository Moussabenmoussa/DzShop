
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzMarket | تجربة تسوق عالمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background-color: #f7f8fa; }

        /* الأيقونة العائمة في البانر */
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(3deg); }
            50% { transform: translateY(-20px) rotate(-3deg); }
            100% { transform: translateY(0px) rotate(3deg); }
        }

        /* تحسين شكل البطاقات */
        .product-card { 
            background: white; border-radius: 20px; transition: 0.3s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        /* شريط العروض العلوي */
        .top-banner {
            background: linear-gradient(90deg, #e63946, #d62828);
            position: relative; overflow: hidden;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <img src="https://res.cloudinary.com/dvtuocsxs/image/upload/f_auto,q_auto/v1765973958/my8crq9sx9aezvda0wrd.webp" 
                     class="w-12 h-12 rounded-2xl shadow-lg border-2 border-red-50" alt="Logo">
                <span class="font-black text-2xl text-red-600 tracking-tighter">DzMarket</span>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-sm font-black text-gray-500 hover:text-red-600 transition">دخول البائعين</a>
                <a href="/dashboard" class="bg-red-600 text-white px-6 py-2.5 rounded-2xl font-black text-xs shadow-xl shadow-red-600/30">انضم إلينا</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <section class="top-banner rounded-[3rem] p-8 md:p-16 text-white relative mb-12 shadow-2xl">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-black/10 rounded-full -ml-32 -mb-32 blur-3xl"></div>

            <div class="grid md:grid-cols-2 gap-12 items-center relative z-10">
                <div>
                    <div class="inline-flex items-center gap-2 bg-black/20 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 border border-white/10">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                        متاح الآن في 58 ولاية
                    </div>
                    <h1 class="text-4xl md:text-7xl font-black leading-tight mb-6">أكبر سوق حر <br> <span class="text-yellow-400 underline decoration-white/20">في الجزائر</span></h1>
                    <p class="text-lg opacity-90 font-bold mb-10 leading-relaxed max-w-md">
                        تسوق آلاف المنتجات، أو ابدأ مشروعك الخاص كمسوق بالعمولة واربح من منزلك.
                    </p>
                    
                    <div class="flex flex-wrap gap-4">
                        <button onclick="window.scrollTo(0, 800)" class="bg-white text-red-600 px-10 py-4 rounded-[1.5rem] font-black text-sm shadow-2xl hover:bg-gray-100 transition">
                            <i class="fas fa-shopping-bag ml-2"></i> تسوق الآن
                        </button>
                        <div class="glass-effect px-6 py-4 rounded-[1.5rem] flex items-center gap-4">
                            <div class="text-center">
                                <p class="text-xs opacity-70">أكثر من</p>
                                <p class="font-black text-xl text-yellow-400">+50k</p>
                            </div>
                            <div class="w-[1px] h-8 bg-white/20"></div>
                            <p class="text-[10px] font-bold">مستخدم نشط <br> يومياً</p>
                        </div>
                    </div>
                </div>

                <div class="hidden md:flex justify-center relative">
                    <img src="https://res.cloudinary.com/dvtuocsxs/image/upload/f_auto,q_auto/v1765973958/my8crq9sx9aezvda0wrd.webp" 
                         class="w-64 h-64 rounded-[3.5rem] shadow-[0_0_80px_rgba(255,255,255,0.3)] floating-icon border-[10px] border-white/10" alt="Icon">
                    
                    <div class="absolute -top-4 -right-4 bg-white text-red-600 p-4 rounded-2xl shadow-2xl rotate-12 font-black text-xs">
                         أمان 100% 🛡️
                    </div>
                    <div class="absolute -bottom-4 -left-4 bg-yellow-400 text-red-900 p-4 rounded-2xl shadow-2xl -rotate-12 font-black text-xs">
                         أرباح فورية 💰
                    </div>
                </div>
            </div>
        </section>

        <h2 class="text-2xl font-black mb-8 flex items-center gap-3">
            <span class="w-10 h-1 bg-red-600 rounded-full"></span>
            أحدث الإعلانات
        </h2>
        
        <div id="marketGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            </div>

    </main>

    <script>
        // ... (نفس كود الجافاسكربت السابق لجلب المنتجات) ...
        window.onload = async () => {
            const res = await fetch('/api/market');
            const data = await res.json();
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = data.map(p => `
                <div class="product-card cursor-pointer" onclick="location.href='/p/${p._id}'">
                    <img src="${p.images?.[0] || p.image || 'https://via.placeholder.com/300'}" class="w-full aspect-square object-cover rounded-t-[20px]">
                    <div class="p-4">
                        <h3 class="font-bold text-sm text-gray-800 line-clamp-2 mb-4">${p.title}</h3>
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-red-600 font-black text-xl">${Number(p.price).toLocaleString()} <span class="text-[10px]">دج</span></p>
                            </div>
                            <span class="text-[9px] bg-gray-100 text-gray-500 px-2 py-1 rounded-md font-bold">الجزائر</span>
                        </div>
                    </div>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
