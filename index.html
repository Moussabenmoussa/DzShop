<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzMarket - السوق المفتوح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f8fafc; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="https://res.cloudinary.com/dvtuocsxs/image/upload/f_auto,q_auto/v1765973958/my8crq9sx9aezvda0wrd.webp" class="w-10 h-10 rounded-xl">
                <span class="font-black text-2xl text-red-600">DzMarket</span>
            </div>
            <a href="/dashboard.html" class="bg-red-600 text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-red-600/20">
                <i class="fas fa-user-circle ml-1"></i> دخول / تسجيل
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
        <div class="mb-8 relative max-w-2xl mx-auto">
            <i class="fas fa-search absolute right-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="searchInput" type="text" placeholder="ابحث عن منتجات، خدمات، أو بائعين..." 
                   class="w-full pr-14 pl-6 py-4 rounded-2xl border-none bg-white shadow-xl outline-none ring-2 ring-transparent focus:ring-red-500/10 transition"
                   oninput="filterProducts()">
        </div>

        <div class="flex gap-2 overflow-x-auto pb-6 no-scrollbar">
            <button onclick="filterCat('all')" class="cat-btn active bg-red-600 text-white px-8 py-2.5 rounded-2xl font-bold whitespace-nowrap">الكل</button>
            <button onclick="filterCat('product')" class="cat-btn bg-white border px-8 py-2.5 rounded-2xl font-bold whitespace-nowrap">منتجات</button>
            <button onclick="filterCat('service')" class="cat-btn bg-white border px-8 py-2.5 rounded-2xl font-bold whitespace-nowrap">خدمات</button>
            <button onclick="filterCat('electronics')" class="cat-btn bg-white border px-8 py-2.5 rounded-2xl font-bold whitespace-nowrap">إلكترونيات</button>
        </div>

        <div id="marketGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-gray-400 animate-pulse">
                <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                <p>جاري تحديث المنتجات...</p>
            </div>
        </div>
    </main>

    <script>
        let ALL_PRODUCTS = [];

        // جلب البيانات فور تحميل الصفحة
        window.onload = async () => {
            try {
                const res = await fetch('/api/market');
                ALL_PRODUCTS = await res.json();
                render(ALL_PRODUCTS);
            } catch (e) {
                document.getElementById('marketGrid').innerHTML = '<p class="text-center col-span-full">عذراً، فشل الاتصال بالسيرفر</p>';
            }
        };

        function render(list) {
            const grid = document.getElementById('marketGrid');
            if(!list.length) { grid.innerHTML = '<p class="text-center col-span-full py-20">لا توجد نتائج</p>'; return; }
            
            grid.innerHTML = list.map(p => `
                <div class="product-card cursor-pointer" onclick="window.location.href='/p/${p._id}'">
                    <img src="${p.images?.[0] || p.image || 'https://via.placeholder.com/300'}" class="product-img">
                    <div class="p-3">
                        <h3 class="font-bold text-sm mb-1 truncate text-gray-800">${p.title}</h3>
                        <div class="flex items-baseline gap-1">
                            <span class="text-red-600 font-black text-lg">${Number(p.price).toLocaleString()}</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase">دج</span>
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2"><i class="fas fa-store ml-1 text-gray-300"></i>${p.userName || 'بائع موثوق'}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = ALL_PRODUCTS.filter(p => p.title.toLowerCase().includes(q));
            render(filtered);
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-red-600', 'text-white');
                b.classList.add('bg-white', 'border');
            });
            event.target.classList.add('bg-red-600', 'text-white');
            
            if(cat === 'all') render(ALL_PRODUCTS);
            else render(ALL_PRODUCTS.filter(p => p.category === cat || p.type === cat));
        }
    </script>
</body>
</html>
