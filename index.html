<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سينما بلس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* === نفس الستايلات الأصلية تماماً === */
        :root { --bg-primary: #1a1a2e; --bg-secondary: #16213e; --bg-card: #1f2544; --accent: #e94560; --text-primary: #ffffff; --text-secondary: #a0a0b8; --text-muted: #6b6b80; --nav-bg: #0f0f1a; --card-radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { font-family: 'Tajawal', sans-serif; background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); color: var(--text-primary); height: 100dvh; overflow: hidden; position: fixed; width: 100vw; }
        #loading-screen { position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease-out; }
        .loader-logo { font-size: 2.2rem; font-weight: 900; color: var(--accent); margin-bottom: 25px; }
        .loader-spinner { width: 45px; height: 45px; border: 3px solid var(--bg-card); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #home-screen { display: none; height: 100dvh; overflow: hidden; background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); padding-bottom: 70px; }
        .search-bar { padding: 15px 16px; position: sticky; top: 0; z-index: 100; background: var(--bg-primary); }
        .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; gap: 12px; cursor: pointer; }
        .search-box i { color: var(--text-secondary); font-size: 1.1rem; } .search-box span { color: var(--text-muted); font-size: 1rem; }
        .tabs-container { padding: 0 16px; margin-bottom: 15px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 18px; border-radius: 20px; font-size: 0.95rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.3s; color: var(--text-secondary); background: transparent; }
        .tab.active { background: var(--accent); color: white; }
        .content-scroll { height: calc(100dvh - 180px); overflow-y: auto; padding: 0 10px 20px; }
        .videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .video-card { position: relative; border-radius: var(--card-radius); overflow: hidden; background: var(--bg-card); cursor: pointer; transition: transform 0.2s; }
        .video-card:active { transform: scale(0.97); }
        .card-poster { position: relative; width: 100%; aspect-ratio: 9/16; overflow: hidden; border-radius: var(--card-radius); background: var(--bg-card); }
        .card-thumbnail { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; background: var(--bg-card); transition: opacity 0.3s; }
        .card-thumbnail.lazy { opacity: 0; } .card-thumbnail.loaded { opacity: 1; }
        .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 10px; z-index: 5; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .card-title { font-size: 0.8rem; font-weight: 700; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 200; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 12px; color: var(--text-muted); transition: color 0.2s; }
        .nav-item.active { color: var(--accent); } .nav-item i { font-size: 1.3rem; } .nav-item span { font-size: 0.65rem; font-weight: 600; }
        #search-screen, #favorites-screen, #player-screen { position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); z-index: 300; display: none; flex-direction: column; }
        #player-screen { background: #000; z-index: 500; }
        #search-screen.active, #favorites-screen.active { display: flex; }
        .player-feed { height: 100%; width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; } .player-feed::-webkit-scrollbar { display: none; }
        .reel-item { height: 100dvh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; }
        .youtube-container { position: absolute; inset: 0; overflow: hidden; }
        .youtube-container iframe { width: 100%; height: 100%; border: none; }
        .player-top-controls { position: absolute; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 70; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%); }
        .player-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); border-radius: 50%; color: white; font-size: 1.1rem; cursor: pointer; }
        .search-header, .screen-header { display: flex; align-items: center; gap: 12px; padding: 15px 16px; background: var(--bg-primary); }
        .search-input-box { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 0 16px; }
        .search-input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo" id="loadingTitle">سينما بلس</div>
        <div class="loader-spinner"></div>
    </div>

    <div id="home-screen">
        <div class="search-bar">
            <div class="search-box" onclick="document.getElementById('search-screen').classList.add('active')">
                <span>بحث</span> <i class="fas fa-search"></i>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs">
                <div class="tab active">الرئيسية</div>
                <div class="tab">الرائج</div>
                <div class="tab">جديد</div>
            </div>
        </div>

        <div class="content-scroll">
            <div class="videos-grid" id="videos-grid"></div>
        </div>
    </div>

    <div id="search-screen">
        <div class="search-header">
            <i class="fas fa-arrow-right" onclick="document.getElementById('search-screen').classList.remove('active')"></i>
            <div class="search-input-box">
                <input type="text" class="search-input" placeholder="ابحث...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></div>
        <div class="nav-item"><i class="fas fa-play-circle"></i><span>لك</span></div>
        <div class="nav-item"><i class="far fa-bookmark"></i><span>المفضلة</span></div>
        <div class="nav-item"><i class="far fa-user"></i><span>حسابي</span></div>
    </div>

    <div id="player-screen">
        <div class="player-top-controls">
            <div class="player-btn" onclick="closePlayer()"><i class="fas fa-arrow-right"></i></div>
        </div>
        <div class="player-feed" id="player-feed"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let VIDEO_IDS = []; // ستأتي من السيرفر
        let players = {};
        let apiReady = false;

        // دالة التهيئة (تعمل عند تحميل الصفحة)
        window.addEventListener('load', async () => {
            // 1. جلب البيانات من السيرفر (MongoDB)
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                // تحديث القائمة والاسم
                VIDEO_IDS = data.videos || [];
                if(data.title) {
                    document.title = data.title;
                    document.getElementById('loadingTitle').innerText = data.title;
                }
            } catch(e) {
                console.log('Error fetching data, using defaults');
                VIDEO_IDS = ['TrgR4aYdSZA', 'L9vAQhDEEcs']; // احتياطي
            }

            // 2. عرض الفيديوهات
            renderGrid();
            
            // 3. إخفاء التحميل
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('home-screen').style.display = 'block';
                }, 500);
            }, 1000);
        });

        function renderGrid() {
            const grid = document.getElementById('videos-grid');
            grid.innerHTML = VIDEO_IDS.map((id, index) => {
                const thumb = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
                return `
                    <div class="video-card" onclick="openPlayer(${index})">
                        <div class="card-poster">
                            <img class="card-thumbnail loaded" src="${thumb}">
                            <div class="card-info"><div class="card-title">فيديو ${index + 1}</div></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openPlayer(index) {
            document.getElementById('player-screen').style.display = 'block';
            const feed = document.getElementById('player-feed');
            feed.innerHTML = ''; 

            VIDEO_IDS.forEach((vidId) => {
                const item = document.createElement('div');
                item.className = 'reel-item';
                item.innerHTML = `<div class="youtube-container" id="yt-${vidId}"></div>`;
                feed.appendChild(item);

                // إنشاء المشغل
                setTimeout(() => {
                    if(!players[vidId]) {
                        players[vidId] = new YT.Player(`yt-${vidId}`, {
                            videoId: vidId,
                            playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'playsinline': 1, 'modestbranding': 1 }
                        });
                    }
                }, 100);
            });

            setTimeout(() => {
                feed.scrollTop = feed.children[index].offsetTop;
                const vidId = VIDEO_IDS[index];
                if(players[vidId] && players[vidId].playVideo) players[vidId].playVideo();
            }, 300);
        }

        function closePlayer() {
            document.getElementById('player-screen').style.display = 'none';
            Object.values(players).forEach(p => {
                if(p && p.pauseVideo) p.pauseVideo();
            });
        }

        window.onYouTubeIframeAPIReady = function() { apiReady = true; };
    </script>
</body>
</html>
