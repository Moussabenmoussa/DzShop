
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzMarket | أكبر سوق جزائري مفتوح</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: #f4f4f4; color: #333; }
        
        /* تأثيرات البطاقات */
        .product-card { 
            background: #fff; border-radius: 12px; transition: all 0.3s ease;
            display: flex; flex-direction: column; height: 100%; position: relative;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px 12px 0 0; }
        
        /* التنبيهات والأوسمة */
        .badge-flash { background: linear-gradient(90deg, #ff4757, #ff6b81); color: #fff; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; }
        .badge-affiliate { background: #2563eb; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; }
        
        /* شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* قسم الـ Hero */
        .hero-banner {
            background: linear-gradient(135deg, #e63946 0%, #b91c1c 100%);
            border-radius: 20px; color: white; overflow: hidden; position: relative;
        }
        
        /* أيقونات التصنيفات */
        .cat-item { min-width: 80px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .cat-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; }
        .cat-item:hover .cat-icon { transform: scale(1.1); background: #fee2e2; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="sticky top-0 z-50 bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="font-black text-2xl text-red-600 tracking-tighter">DZMARKET</span>
            </div>
            
            <div class="flex-1 max-w-xl mx-8 hidden md:block">
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="ابحث عن العروض، المنتجات..." 
                           class="w-full bg-gray-100 border-none rounded-full py-2.5 pr-12 pl-4 focus:ring-2 focus:ring-red-500/20 outline-none text-sm"
                           oninput="filterProducts()">
                    <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-sm font-bold text-gray-700 hover:text-red-600">لوحة التحكم</a>
                <a href="/dashboard" class="bg-red-600 text-white px-5 py-2 rounded-full font-black text-xs shadow-lg shadow-red-600/20">سجل الآن</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <section class="hero-banner p-8 md:p-12 mb-8">
            <div class="max-w-lg relative z-10">
                <span class="bg-yellow-400 text-red-900 text-[10px] font-black px-3 py-1 rounded-full uppercase">عروض الشتاء الجزائري</span>
                <h1 class="text-3xl md:text-5xl font-black mt-4 leading-tight">تسوّق أفضل السلع <br> بأسعار المصنع</h1>
                <p class="text-sm opacity-90 mt-4 font-bold">توصيل سريع لكل الولايات 🇩🇿 • ضمان الجودة • دفع عند الاستلام</p>
                <div class="mt-8 flex gap-3">
                    <button onclick="window.scrollTo(0, 600)" class="bg-white text-red-600 px-8 py-3 rounded-full font-black text-sm shadow-xl">اكتشف الآن</button>
                    <button onclick="location.href='/dashboard'" class="bg-red-500 text-white border border-red-400 px-8 py-3 rounded-full font-black text-sm">ابدأ البيع</button>
                </div>
            </div>
            <i class="fas fa-shopping-bag absolute -bottom-10 -left-10 text-[200px] opacity-10 -rotate-12"></i>
        </section>

        <section class="mb-10 overflow-x-auto no-scrollbar py-2">
            <div class="flex gap-6 justify-between min-w-max">
                <div class="cat-item" onclick="filterCategory('electronics')">
                    <div class="cat-icon text-blue-500"><i class="fas fa-mobile-alt text-xl"></i></div>
                    <span class="text-[11px] font-black">إلكترونيات</span>
                </div>
                <div class="cat-item" onclick="filterCategory('fashion')">
                    <div class="cat-icon text-pink-500"><i class="fas fa-tshirt text-xl"></i></div>
                    <span class="text-[11px] font-black">أزياء</span>
                </div>
                <div class="cat-item" onclick="filterCategory('home')">
                    <div class="cat-icon text-orange-500"><i class="fas fa-couch text-xl"></i></div>
                    <span class="text-[11px] font-black">منزل</span>
                </div>
                <div class="cat-item" onclick="filterCategory('beauty')">
                    <div class="cat-icon text-purple-500"><i class="fas fa-magic text-xl"></i></div>
                    <span class="text-[11px] font-black">جمال</span>
                </div>
                <div class="cat-item" onclick="filterCategory('sports')">
                    <div class="cat-icon text-green-500"><i class="fas fa-dumbbell text-xl"></i></div>
                    <span class="text-[11px] font-black">رياضة</span>
                </div>
                <div class="cat-item" onclick="filterCategory('service')">
                    <div class="cat-icon text-yellow-500"><i class="fas fa-handshake text-xl"></i></div>
                    <span class="text-[11px] font-black">خدمات</span>
                </div>
                <div class="cat-item" onclick="filterCategory('all')">
                    <div class="cat-icon text-red-600"><i class="fas fa-th-large text-xl"></i></div>
                    <span class="text-[11px] font-black">الكل</span>
                </div>
            </div>
        </section>

        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <h2 class="text-xl font-black text-gray-800">عروض مختارة لك</h2>
                <span class="bg-red-100 text-red-600 text-[10px] font-black px-2 py-1 rounded">Flash Sale</span>
            </div>
            <div id="countdown" class="text-xs font-bold text-gray-500">ينتهي العرض خلال 05:12:44</div>
        </div>

        <div id="marketGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <div class="h-64 bg-white rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-white rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-white rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-white rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-white rounded-2xl animate-pulse"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 md:hidden z-50">
        <button onclick="location.reload()" class="flex flex-col items-center text-red-600"><i class="fas fa-home text-lg"></i><span class="text-[10px] font-bold">الرئيسية</span></button>
        <button onclick="filterCategory('product')" class="flex flex-col items-center text-gray-400"><i class="fas fa-box text-lg"></i><span class="text-[10px] font-bold">منتجات</span></button>
        <button onclick="filterCategory('service')" class="flex flex-col items-center text-gray-400"><i class="fas fa-tools text-lg"></i><span class="text-[10px] font-bold">خدمات</span></button>
        <button onclick="location.href='/dashboard'" class="flex flex-col items-center text-gray-400"><i class="fas fa-user text-lg"></i><span class="text-[10px] font-bold">دخول</span></button>
    </nav>

    <script>
        let ALL_PRODUCTS = [];

        window.onload = async () => {
            try {
                const res = await fetch('/api/market');
                ALL_PRODUCTS = await res.json();
                renderProducts(ALL_PRODUCTS);
                startCountdown();
            } catch (e) {
                document.getElementById('marketGrid').innerHTML = '<p class="col-span-full text-center py-20 text-red-500 font-bold">تعذر تحميل البيانات، يرجى التحقق من الاتصال</p>';
            }
        };

        function renderProducts(list) {
            const grid = document.getElementById('marketGrid');
            if(!list.length) {
                grid.innerHTML = '<div class="col-span-full text-center py-20"><p class="text-gray-400 font-bold">لا توجد منتجات حالياً في هذا القسم</p></div>';
                return;
            }

            grid.innerHTML = list.map(p => {
                const discount = (p.originalPrice && p.originalPrice > p.price) 
                    ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
                
                return `
                <div class="product-card" onclick="window.location.href='/p/${p._id}'">
                    <div class="relative overflow-hidden">
                        <img src="${p.images?.[0] || p.image || 'https://via.placeholder.com/300'}" class="product-img">
                        ${discount > 0 ? `<div class="badge-flash absolute top-2 right-2">-${discount}%</div>` : ''}
                        ${p.isAffiliate ? `<div class="badge-affiliate absolute top-2 left-2"><i class="fas fa-hand-holding-usd mr-1"></i>عمولة</div>` : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="text-[12px] font-bold text-gray-700 line-clamp-2 mb-2 min-h-[32px]">${p.title}</h3>
                        <div class="mt-auto">
                            <div class="flex items-baseline gap-1.5">
                                <span class="text-red-600 font-black text-lg">${Number(p.price).toLocaleString()}</span>
                                <span class="text-[9px] text-red-600 font-bold uppercase tracking-tighter">دج</span>
                            </div>
                            ${p.originalPrice ? `<span class="text-[10px] text-gray-400 line-through">${Number(p.originalPrice).toLocaleString()} دج</span>` : ''}
                            
                            <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-50">
                                <span class="text-[9px] text-gray-400 font-bold"><i class="fas fa-map-marker-alt ml-1"></i>الجزائر</span>
                                <span class="text-[9px] text-green-600 font-black">شحن مجاني</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(ALL_PRODUCTS.filter(p => p.title.toLowerCase().includes(q)));
        }

        function filterCategory(cat) {
            if(cat === 'all') renderProducts(ALL_PRODUCTS);
            else renderProducts(ALL_PRODUCTS.filter(p => p.category === cat || p.type === cat));
            window.scrollTo(0, 500);
        }

        function startCountdown() {
            let h = 5, m = 12, s = 44;
            setInterval(() => {
                s--;
                if(s < 0) { s = 59; m--; }
                if(m < 0) { m = 59; h--; }
                document.getElementById('countdown').innerText = `ينتهي العرض خلال ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
